<!--
  Scene : reveal-stratifie
  ------------------------
  Le REVEAL stratifié post-scan (02-reveal), modèle « bottom sheet à 2 crans ».
    • Héros 3D (haut, rotatable au doigt) — réutilise scenes/_coin3d.js. Reste
      PLEIN en haut dans les deux crans (ne se réduit pas — rétro user).
    • Bottom sheet draggable avec POIGNÉE :
        - peek (cran 1)     : résumé Découverte = ≤3 drives (titre + 1 ligne
                              d'histoire + chips Nouvelle/complétion/accent).
        - déployé (cran 2)  : tire la poignée → sections Histoire / Rareté /
                              Valeur / Complétion (scroll). Vertical = profondeur.
    • CTAs ÉPINGLÉS en bas de la sheet (toujours accessibles — rétro user).
    • Profondeur ultime : « Voir la fiche » → page pièce.

  Query : ?id=<numista_id> · ?owned=1 (doublon)
  Garde-fous : valeur = info, défaut Découverte, économie des célébrations (pas
  de pic ici), zéro hasard.
-->

<style>
  .reveal-root {
    position: absolute;
    inset: 0;
    color: var(--surface);
    background:
      radial-gradient(120% 56% at 50% -10%, var(--indigo-700) 0%, transparent 55%),
      radial-gradient(ellipse 70% 42% at 50% 20%, var(--ink-soft) 0%, var(--ink) 60%, #000 100%);
    overflow: hidden;
  }

  /* ───────── Top bar ───────── */
  .reveal-top {
    position: absolute;
    top: 58px; left: var(--space-5); right: var(--space-5);
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: space-between;
    pointer-events: none;
  }
  .reveal-top__owned {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 5px 11px;
    border-radius: var(--radius-full);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.14);
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold-300);
  }
  .reveal-root[data-owned="1"] .reveal-top__owned { display: inline-flex; }
  .reveal-close {
    width: 34px; height: 34px;
    border-radius: var(--radius-full);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.14);
    color: rgba(255, 255, 255, 0.8);
    font-size: 18px; line-height: 1;
    pointer-events: auto;
  }
  .reveal-close:active { transform: scale(0.94); }

  /* ───────── Hero 3D band (fixed at top, stays full) ───────── */
  .reveal-hero {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 40%;
    z-index: 1;
  }
  .reveal-hero__canvas { position: absolute; inset: 0; }
  /* setSize(…, false) doesn't style the canvas → force it to fill (else it lays
     out at the device-pixel buffer size, 2× on retina, and overflows). */
  .reveal-hero__canvas canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
    touch-action: none;
    cursor: grab;
  }
  .reveal-hero__canvas canvas:active { cursor: grabbing; }
  .reveal-hero__status {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: rgba(255, 255, 255, 0.5);
    transition: opacity var(--duration-base) ease;
  }
  .reveal-hero__status.is-hidden { opacity: 0; }
  .reveal-hero__hint {
    position: absolute;
    left: 50%; bottom: 2px;
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.4);
    transition: opacity var(--duration-base) ease;
  }
  .reveal-hero__hint svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.6; }
  .reveal-root[data-rotated="1"] .reveal-hero__hint { opacity: 0; }

  /* ───────── Bottom sheet (2 detents) ───────── */
  .reveal-sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    /* height set by JS (peek / expanded). The CTA footer is the last flex child,
       so the 88px bottom padding keeps it above the bottom nav. */
    padding-bottom: 88px;
    border-radius: var(--radius-2xl) var(--radius-2xl) 0 0;
    background: linear-gradient(180deg, rgba(26, 27, 75, 0.55) 0%, rgba(14, 14, 31, 0.94) 16%, rgba(11, 12, 34, 0.98) 100%);
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 -24px 60px rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(18px);
    transition: height var(--duration-slow) var(--ease-out);
    will-change: height;
  }
  .reveal-sheet::after {
    content: "";
    position: absolute;
    left: var(--space-6); right: var(--space-6); top: 30px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold) 22%, var(--gold) 78%, transparent);
    opacity: 0.4;
    pointer-events: none;
  }

  .reveal-sheet__handle {
    flex: 0 0 auto;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    cursor: grab;
  }
  .reveal-sheet__handle:active { cursor: grabbing; }
  .reveal-sheet__grip {
    width: 42px; height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.32);
    transition: width var(--duration-base) var(--ease-out), background var(--duration-fast) var(--ease-out);
  }
  .reveal-root[data-state="expanded"] .reveal-sheet__grip { width: 30px; background: rgba(255, 255, 255, 0.22); }

  /* Scrollable middle (summary + sections) */
  .reveal-sheet__scroll {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: hidden;                 /* peek : no scroll — pull the handle */
    -webkit-overflow-scrolling: touch;
    padding: var(--space-1) var(--space-5) 0;
  }
  .reveal-root[data-state="expanded"] .reveal-sheet__scroll { overflow-y: auto; }
  .reveal-sheet__scroll::-webkit-scrollbar { display: none; }

  /* ── Summary (peek) ── */
  .reveal-sum__eyebrow {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: var(--tracking-eyebrow);
    text-transform: uppercase;
    color: var(--gold-300);
  }
  .reveal-sum__title {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 400;
    font-size: var(--text-2xl);
    line-height: var(--leading-tight);
    color: var(--surface);
    margin: 4px 0 2px;
  }
  .reveal-sum__sub {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.5);
  }
  .reveal-sum__line {
    font-size: var(--text-sm);
    line-height: var(--leading-base);
    color: rgba(255, 255, 255, 0.74);
    margin-top: var(--space-3);
  }
  .reveal-drives {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
    margin-top: var(--space-4);
  }
  .reveal-drive {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 11px;
    border-radius: var(--radius-full);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    color: rgba(255, 255, 255, 0.85);
  }
  .reveal-drive--accent { background: rgba(224, 198, 136, 0.14); border-color: rgba(224, 198, 136, 0.4); color: var(--gold-300); }
  .reveal-drive--new { background: var(--success-soft); border-color: rgba(47, 169, 113, 0.5); color: #6fe0a8; }

  /* ── More (expanded sections) ── */
  .reveal-more__hint {
    margin: var(--space-6) 0 var(--space-3);
    display: flex;
    align-items: center;
    gap: var(--space-3);
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: var(--tracking-eyebrow);
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.4);
  }
  .reveal-more__hint::before,
  .reveal-more__hint::after { content: ""; flex: 1; height: 1px; background: rgba(255, 255, 255, 0.1); }

  .reveal-sec { padding: var(--space-4) 0; border-bottom: 1px solid rgba(255, 255, 255, 0.07); }
  .reveal-sec:last-child { border-bottom: 0; }
  .reveal-sec__eyebrow {
    display: block;
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: var(--tracking-eyebrow);
    text-transform: uppercase;
    color: var(--gold-300);
    margin-bottom: var(--space-2);
  }
  .reveal-sec__line { font-size: var(--text-sm); line-height: var(--leading-base); color: rgba(255,255,255,0.74); }
  .reveal-sec__line + .reveal-sec__line { margin-top: var(--space-2); }
  .reveal-tier { font-family: var(--font-display); font-style: italic; font-size: var(--text-xl); color: var(--gold-300); margin-bottom: var(--space-1); }
  .reveal-grades { display: flex; gap: var(--space-2); margin-top: var(--space-3); }
  .reveal-grade {
    flex: 1; text-align: center;
    padding: var(--space-2) 0;
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .reveal-grade__g { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.1em; color: rgba(255,255,255,0.5); }
  .reveal-grade__v { font-family: var(--font-display); font-style: italic; font-size: var(--text-base); color: var(--surface); margin-top: 2px; }
  .reveal-comp { display: flex; align-items: baseline; gap: var(--space-2); }
  .reveal-comp__big { font-family: var(--font-display); font-style: italic; font-size: var(--text-2xl); color: var(--surface); }
  .reveal-comp__total { font-family: var(--font-mono); font-size: var(--text-sm); color: rgba(255,255,255,0.55); }
  .reveal-comp__bar { margin: var(--space-3) 0 var(--space-2); }
  .reveal-comp__bar .progress-track { background: rgba(255,255,255,0.12); }
  .reveal-comp__missing { font-size: var(--text-xs); color: rgba(255,255,255,0.6); }

  /* ───────── Célébration overlay (jalon) — superposée, jamais un 2e écran ─────────
     La fête se joue PAR-DESSUS le reveal + ré-accentue les éléments déjà là. */
  .reveal-cel { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  .reveal-root:not([data-milestone]) .reveal-cel { display: none; }
  .reveal-cel__bannerwrap {
    position: absolute;
    top: 72px; left: 0; right: 0;
    display: flex; justify-content: center;
  }
  .reveal-cel__banner {
    position: relative;
    padding: 7px 20px;
    background: linear-gradient(180deg, var(--gold-300) 0%, var(--gold) 55%, var(--gold-deep) 100%);
    color: var(--indigo-900);
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    box-shadow: 0 10px 22px -10px rgba(200, 168, 100, 0.8);
    animation: reveal-cel-drop 0.6s var(--ease-spring) 0.25s both;
  }
  .reveal-cel__banner::before,
  .reveal-cel__banner::after {
    content: ""; position: absolute; top: 100%;
    width: 0; height: 0; border-style: solid;
  }
  .reveal-cel__banner::before { left: 0;  border-width: 8px 0 0 11px; border-color: transparent transparent transparent var(--gold-deep); }
  .reveal-cel__banner::after  { right: 0; border-width: 8px 11px 0 0; border-color: transparent var(--gold-deep) transparent transparent; }
  @keyframes reveal-cel-drop {
    0%   { transform: translateY(-18px) scale(0.92); opacity: 0; }
    100% { transform: none; opacity: 1; }
  }

  /* Ré-accentuation en place quand un jalon est actif */
  .reveal-root[data-milestone] .reveal-hero::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 46%, rgba(200, 168, 100, 0.3) 0%, transparent 56%);
    animation: reveal-cel-bloom 1.1s var(--ease-out) both;
  }
  @keyframes reveal-cel-bloom { from { opacity: 0; } to { opacity: 1; } }

  /* Rayons tournants derrière la pièce — réservés au PIC (exploit/rareté). Le
     canvas 3D a un fond transparent, donc ils rayonnent autour de la pièce. */
  .reveal-cel__rays { display: none; }
  .reveal-root[data-milestone="feat"] .reveal-cel__rays {
    display: block;
    position: absolute;
    top: 46%; left: 50%;
    width: 150%; aspect-ratio: 1;
    transform: translate(-50%, -50%);
    pointer-events: none;
    opacity: 0.34;
    border-radius: 50%;
    background: conic-gradient(from 0deg,
      transparent 0deg, rgba(200,168,100,0.22) 7deg, transparent 20deg,
      transparent 45deg, rgba(200,168,100,0.15) 52deg, transparent 66deg,
      transparent 90deg, rgba(200,168,100,0.2) 98deg, transparent 112deg,
      transparent 135deg, rgba(200,168,100,0.13) 142deg, transparent 156deg,
      transparent 180deg, rgba(200,168,100,0.2) 188deg, transparent 202deg,
      transparent 225deg, rgba(200,168,100,0.15) 233deg, transparent 247deg,
      transparent 270deg, rgba(200,168,100,0.2) 278deg, transparent 292deg,
      transparent 315deg, rgba(200,168,100,0.13) 323deg, transparent 337deg);
    mask-image: radial-gradient(circle, transparent 30%, #000 42%, transparent 74%);
    -webkit-mask-image: radial-gradient(circle, transparent 30%, #000 42%, transparent 74%);
    animation: reveal-cel-rays 64s linear infinite;
  }
  @keyframes reveal-cel-rays { to { transform: translate(-50%, -50%) rotate(360deg); } }
  /* Le pic pousse l'intensité du halo. */
  .reveal-root[data-milestone="feat"] .reveal-hero::after {
    background: radial-gradient(circle at 50% 46%, rgba(200, 168, 100, 0.42) 0%, transparent 60%);
  }
  .reveal-root[data-milestone] .reveal-hero__canvas { animation: reveal-cel-pulse 0.85s var(--ease-spring) 0.2s 1; }
  @keyframes reveal-cel-pulse { 0% { transform: scale(1); } 45% { transform: scale(1.06); } 100% { transform: scale(1); } }
  .reveal-root[data-milestone] .reveal-drive--accent { animation: reveal-cel-chip 0.9s var(--ease-out) 0.5s 1; }
  @keyframes reveal-cel-chip {
    0%, 100% { box-shadow: 0 0 0 0 rgba(200, 168, 100, 0); }
    40%      { box-shadow: 0 0 0 4px rgba(200, 168, 100, 0.25); }
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal-cel__banner,
    .reveal-cel__rays,
    .reveal-root[data-milestone] .reveal-hero__canvas,
    .reveal-root[data-milestone] .reveal-drive--accent { animation: none; }
  }

  /* ── Pinned CTAs (sheet footer) ── */
  .reveal-cta {
    flex: 0 0 auto;
    display: flex;
    gap: var(--space-3);
    padding: var(--space-3) var(--space-5) 0;
  }
  .reveal-cta .btn { flex: 1; }
</style>

<section class="reveal-root" data-scene="reveal-stratifie" data-state="peek" data-owned="0" data-rotated="0">
  <!-- Top bar -->
  <div class="reveal-top">
    <span class="reveal-top__owned"><span aria-hidden="true">✓</span> Déjà au coffre</span>
    <span style="flex:1"></span>
    <button type="button" class="reveal-close" data-action="close" aria-label="Fermer">&times;</button>
  </div>

  <!-- Hero 3D (stays full at top) -->
  <div class="reveal-hero">
    <div class="reveal-cel__rays" aria-hidden="true"></div>
    <div class="reveal-hero__canvas" data-slot="canvas-wrap"></div>
    <div class="reveal-hero__status" data-slot="status">Révélation…</div>
    <div class="reveal-hero__hint" data-slot="hint">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/></svg>
      Tourne-la
    </div>
  </div>

  <!-- Célébration overlay (jalon) : superposée au reveal, JAMAIS un 2e écran.
       Cachée tant que data-milestone n'est pas posé. -->
  <div class="reveal-cel" data-slot="celebration" aria-hidden="true">
    <div class="cel-confetti" data-slot="cel-confetti"></div>
    <div class="reveal-cel__bannerwrap">
      <span class="reveal-cel__banner" data-slot="cel-label">Série complète</span>
    </div>
  </div>

  <!-- Bottom sheet -->
  <aside class="reveal-sheet" data-slot="sheet" aria-label="Détails de la pièce">
    <button type="button" class="reveal-sheet__handle" data-action="toggle" aria-label="Déployer les détails">
      <span class="reveal-sheet__grip" aria-hidden="true"></span>
    </button>

    <div class="reveal-sheet__scroll" data-slot="scroll">
      <!-- Summary (measured to size the peek detent) -->
      <div class="reveal-sum" data-slot="summary">
        <span class="reveal-sum__eyebrow" data-slot="kicker">Nouvelle pièce</span>
        <h2 class="reveal-sum__title" data-slot="d-title">—</h2>
        <div class="reveal-sum__sub"><span data-slot="cap-country">—</span> · <span data-slot="cap-year">—</span> · 2&nbsp;€</div>
        <p class="reveal-sum__line" data-slot="d-history">—</p>
        <div class="reveal-drives">
          <span class="reveal-drive reveal-drive--new" data-slot="d-new">Nouvelle</span>
          <span class="reveal-drive" data-slot="d-comp">—</span>
          <span class="reveal-drive reveal-drive--accent" data-slot="d-accent">—</span>
        </div>
      </div>

      <!-- More (depth) -->
      <div class="reveal-more">
        <div class="reveal-more__hint">Plus de détails</div>

        <section class="reveal-sec">
          <span class="reveal-sec__eyebrow">Histoire</span>
          <p class="reveal-sec__line" data-slot="h-1">—</p>
          <p class="reveal-sec__line" data-slot="h-2">—</p>
        </section>

        <section class="reveal-sec">
          <span class="reveal-sec__eyebrow">Rareté</span>
          <div class="reveal-tier" data-slot="r-tier">—</div>
          <p class="reveal-sec__line" data-slot="r-mintage">—</p>
          <p class="reveal-sec__line" data-slot="r-neffect">—</p>
        </section>

        <section class="reveal-sec">
          <span class="reveal-sec__eyebrow">Valeur · indicative</span>
          <div class="reveal-tier" data-slot="v-headline">—</div>
          <div class="reveal-grades">
            <div class="reveal-grade"><div class="reveal-grade__g">UNC</div><div class="reveal-grade__v" data-slot="v-unc">—</div></div>
            <div class="reveal-grade"><div class="reveal-grade__g">TTB</div><div class="reveal-grade__v" data-slot="v-ttb">—</div></div>
            <div class="reveal-grade"><div class="reveal-grade__g">TB</div><div class="reveal-grade__v" data-slot="v-tb">—</div></div>
          </div>
        </section>

        <section class="reveal-sec">
          <span class="reveal-sec__eyebrow">Complétion</span>
          <div class="reveal-comp">
            <span class="reveal-comp__big" data-slot="c-owned">—</span>
            <span class="reveal-comp__total" data-slot="c-total">/ —</span>
          </div>
          <div class="reveal-comp__bar progress-bar">
            <div class="progress-track"><div class="progress-fill" data-slot="c-fill" style="width:0%"></div></div>
          </div>
          <p class="reveal-comp__missing" data-slot="c-missing">—</p>
        </section>
      </div>
    </div>

    <!-- Pinned CTAs -->
    <div class="reveal-cta">
      <button type="button" class="btn btn-ghost btn-ghost--on-dark" data-action="details">Voir la fiche</button>
      <button type="button" class="btn btn-gold" data-action="add">Ajouter au coffre</button>
    </div>
  </aside>
</section>
