services:
  eurio-api:
    build:
      context: .
      dockerfile: Dockerfile
      # On aspire ml/ depuis le repo sans tarballer tout le monorepo.
      additional_contexts:
        ml: ../../ml
    image: eurio-api:latest
    container_name: eurio-api
    restart: unless-stopped
    volumes:
      # Canonique eurio.db (SQLite WAL) — bind-mount gitignoré. Le serveur en est
      # le writer unique ; seedé depuis MinIO au 1er boot (entrypoint).
      - ./data:/var/lib/eurio
    environment:
      # Secrets injectés depuis l'env du process docker-compose.
      # Source unique : ../../secrets/dev.env (SOPS+age).
      # Déploiement : `sops exec-env ../../secrets/dev.env "docker compose up -d --build"`
      # (cf. README.md). Le `:?missing` fait échouer compose si la var n'est pas définie.
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?missing - run via `sops exec-env`}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?missing - run via `sops exec-env`}

      # Config non-sensible (peut rester en clair ici).
      EURIO_DB_PATH: /var/lib/eurio/eurio.db
      EURIO_API_AUTH_REQUIRED: "1"          # auth bearer OBLIGATOIRE sur le VPS
      EURIO_API_CORS_ORIGINS: "https://eurio-admin.musubi.dev,http://localhost:5173"
      # OIDC Authentik (auth-redesign C2). URLs publiques, OK en clair.
      EURIO_OIDC_ISSUER: https://authentik.musubi.dev/application/o/eurio-panel/
      EURIO_OIDC_JWKS_URL: https://authentik.musubi.dev/application/o/eurio-panel/jwks/
      EURIO_OIDC_AUTHORIZATION_ENDPOINT: https://authentik.musubi.dev/application/o/authorize/
      EURIO_OIDC_TOKEN_ENDPOINT: https://authentik.musubi.dev/application/o/token/
      EURIO_OIDC_END_SESSION_ENDPOINT: https://authentik.musubi.dev/application/o/eurio-panel/end-session/
      EURIO_OIDC_CLIENT_ID: 8nFCZsZV0Pryxcjse0pOq2YQvLbdWXP8gmwYbh82
      EURIO_OIDC_REDIRECT_URI: https://eurio-api.musubi.dev/auth/oidc/callback
      EURIO_PANEL_ORIGIN: https://eurio-admin.musubi.dev
      EURIO_COOKIE_NAME: eurio_session
      # Pas de Domain explicite : cookie est lié à eurio-api.musubi.dev,
      # envoyé par le browser uniquement sur les XHR vers cet host.
      # OIDC client_secret + session signing key (SOPS).
      EURIO_OIDC_CLIENT_SECRET: ${EURIO_OIDC_CLIENT_SECRET:?missing - voir secrets/dev.env}
      EURIO_SESSION_SECRET: ${EURIO_SESSION_SECRET:?missing - voir secrets/dev.env}
      # Accès MinIO — endpoint INTERNE (même réseau docker `traefik`) : eurio-api
      # ne sert pas d'assets (image lean), son seul usage MinIO est le sync C8
      # (canonical_sync : canonique VPS → bucket eurio-db pour la fraîcheur réplique).
      # On évite le hairpin par le LB public eurio-s3.musubi.dev (non résolu depuis
      # le conteneur). Le Mac, lui, garde l'endpoint public pour pull_replica.
      MINIO_ENDPOINT: eurio-minio:9000
      MINIO_USE_SSL: "false"
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.eurio-api.rule=Host(`eurio-api.musubi.dev`)
      - traefik.http.routers.eurio-api.entrypoints=websecure
      - traefik.http.routers.eurio-api.tls=true
      - traefik.http.routers.eurio-api.tls.certresolver=letsencryptresolver
      - traefik.http.routers.eurio-api.service=eurio-api
      - traefik.http.services.eurio-api.loadbalancer.server.port=8042

networks:
  traefik:
    external: true
