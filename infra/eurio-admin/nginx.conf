# SPA fallback : toutes les routes côté client (vue-router HTML5 history) sont
# rendues par /index.html. Les assets versionnés (Vite) sont gzippés et
# cache-busted via leur hash dans le nom.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Assets immuables (Vite met un hash dans le nom).
    location ~* ^/assets/.*$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA — toujours retomber sur index.html pour le routing client.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Sécurité minimale.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip pour le HTML + JSON (les .js/.css Vite sont déjà bien compressés).
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
