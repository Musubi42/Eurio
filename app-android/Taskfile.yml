version: '3'

vars:
  APP_ID: com.musubi.eurio
  MAIN_ACTIVITY: '{{.APP_ID}}/.MainActivity'
  DEBUG_DIR_DEVICE: /sdcard/Android/data/{{.APP_ID}}/files/Documents/eurio_debug
  CAPTURE_DIR_DEVICE: /sdcard/Android/data/{{.APP_ID}}/files/Documents/eurio_capture
  DEBUG_PULL_ROOT: '{{.ROOT_DIR}}/debug_pull'

tasks:
  build:
    desc: Assemble the debug APK
    dir: '{{.ROOT_DIR}}'
    cmds:
      - ./gradlew :app-android:assembleDebug

  install:
    desc: Build + push APK to the connected device
    dir: '{{.ROOT_DIR}}'
    cmds:
      - ./gradlew :app-android:installDebug

  start:
    desc: Launch the app on the device (does not rebuild)
    cmds:
      - adb shell am start -n {{.MAIN_ACTIVITY}}

  run:
    desc: Install + start (the default dev loop)
    cmds:
      - task: install
      - task: start

  build-qa:
    desc: Assemble the QA APK (with parity state injection)
    dir: '{{.ROOT_DIR}}'
    cmds:
      - ./gradlew :app-android:assembleQa

  install-qa:
    desc: Build + push QA APK to the connected device
    dir: '{{.ROOT_DIR}}'
    cmds:
      - ./gradlew :app-android:installQa

  run-qa:
    desc: Install + start QA build
    cmds:
      - task: install-qa
      - adb shell am start -n com.musubi.eurio.qa/.MainActivity

  logs:
    desc: Tail logcat, filtered on Eurio ML tags
    cmds:
      - adb logcat -c
      - adb logcat Eurio:D CoinAnalyzer:D CoinDetector:D AndroidRuntime:E '*:S'

  logs-all:
    desc: Tail logcat with no filter
    cmds:
      - adb logcat

  devices:
    desc: List connected adb devices (Wi-Fi or USB)
    cmds:
      - adb devices -l

  pull-debug:
    desc: Pull debug captures from the device into ./debug_pull/TIMESTAMP/
    vars:
      TS:
        sh: date +%Y%m%d_%H%M%S
    cmds:
      - mkdir -p {{.DEBUG_PULL_ROOT}}/{{.TS}}
      - adb pull {{.DEBUG_DIR_DEVICE}}/ {{.DEBUG_PULL_ROOT}}/{{.TS}}/
      - echo "Pulled to {{.DEBUG_PULL_ROOT}}/{{.TS}}/"

  push-capture-csv:
    desc: Push a cohort capture CSV to the device, then force-stop the app so the new list is picked up on next launch
    summary: |
      Usage: go-task -t app-android/Taskfile.yml push-capture-csv CSV=ml/state/cohort_csvs/<slug>.csv
      Generated by the admin "Cohort capture flow" — see docs/admin/cohort-capture-flow/design.md
    vars:
      CSV: '{{.CSV}}'
    preconditions:
      - sh: 'test -n "{{.CSV}}"'
        msg: "CSV var required: pass CSV=<path> on the command line"
      - sh: 'test -f {{.CSV}}'
        msg: "CSV file not found: {{.CSV}}"
    cmds:
      - adb shell mkdir -p {{.CAPTURE_DIR_DEVICE}}
      - adb push {{.CSV}} {{.CAPTURE_DIR_DEVICE}}/cohort.csv
      - adb shell am force-stop {{.APP_ID}}
      - echo "Pushed {{.CSV}} → {{.CAPTURE_DIR_DEVICE}}/cohort.csv. Re-launch the app to pick up the new cohort."

  clean-debug:
    desc: Delete all debug captures on the device
    cmds:
      - adb shell rm -rf {{.DEBUG_DIR_DEVICE}}
      - echo "Device debug dir cleaned"

  clean:
    desc: Gradle clean for app-android
    dir: '{{.ROOT_DIR}}'
    cmds:
      - ./gradlew :app-android:clean

  stop:
    desc: Force-stop the app on the device
    cmds:
      - adb shell am force-stop {{.APP_ID}}

  parity:capture:
    desc: Run all Maestro parity flows and capture screenshots
    dir: '{{.ROOT_DIR}}'
    deps: [install-qa]
    cmds:
      - |
        for f in admin/packages/parity/flows/*.yaml; do
          maestro test --test-output-dir admin/packages/parity/screenshots/android "$f"
        done

  parity:capture-scene:
    desc: Capture a single scene (go-task android:parity:capture-scene -- vault-home)
    dir: '{{.ROOT_DIR}}'
    cmds:
      - maestro test --test-output-dir admin/packages/parity/screenshots/android admin/packages/parity/flows/{{.CLI_ARGS}}.yaml

  snapshot:
    desc: Export a fresh catalog_snapshot.json from Supabase into assets/
    dir: '{{.ROOT_DIR}}/ml'
    cmds:
      - .venv/bin/python -m export.export_catalog_snapshot

  snapshot-dry:
    desc: Preview the catalog snapshot (counts + size) without writing
    dir: '{{.ROOT_DIR}}/ml'
    cmds:
      - .venv/bin/python -m export.export_catalog_snapshot --dry-run

  cohort-test:bundle:
    desc: "Build the cohortTest APK bundle (model + filtered catalog + manifests). COHORT + ITERATION required."
    summary: |
      Usage: go-task -t app-android/Taskfile.yml cohort-test:bundle COHORT=<name> ITERATION=<iid>
      Drops 6 files into app-android/src/cohortTest/assets/cohort_bundle/ so the
      next assembleCohortTestDebug picks them up. Cf. docs/training-pipeline/sprint-3-cohort-test-app.md.
    vars:
      COHORT: '{{.COHORT}}'
      ITERATION: '{{.ITERATION}}'
      OUT: '{{.ROOT_DIR}}/ml/output/cohort_test_{{.ITERATION}}'
      BUNDLE_DIR: '{{.ROOT_DIR}}/app-android/src/cohortTest/assets/cohort_bundle'
    preconditions:
      - sh: 'test -n "{{.COHORT}}" && test -n "{{.ITERATION}}"'
        msg: "COHORT and ITERATION required (e.g. COHORT=green-v1 ITERATION=8a92f1b3)"
    cmds:
      - cd {{.ROOT_DIR}}/ml && .venv/bin/python -m scripts.build_cohort_bundle --cohort {{.COHORT}} --iteration {{.ITERATION}} --out {{.OUT}}
      - rm -rf {{.BUNDLE_DIR}}
      - mkdir -p {{.BUNDLE_DIR}}
      - cp {{.OUT}}/* {{.BUNDLE_DIR}}/
      - echo "Bundle staged at {{.BUNDLE_DIR}}"

  cohort-test:install:
    desc: "Bundle + build + install the cohortTest APK on the device. COHORT + ITERATION required."
    summary: |
      Usage: go-task -t app-android/Taskfile.yml cohort-test:install COHORT=<name> ITERATION=<iid>
      Runs cohort-test:bundle then assembles + installs the cohortTest debug APK.
      The cohortTest applicationId is com.musubi.eurio.cohorttest, which cohabits
      with the prod com.musubi.eurio install on the same device.
    deps: [cohort-test:bundle]
    dir: '{{.ROOT_DIR}}'
    cmds:
      - ./gradlew :app-android:installCohortTestDebug
      - adb shell am force-stop {{.APP_ID}}.cohorttest
      - echo "Installed. Open 'Eurio Test' on the device."

  cohort-test:pull-tests:
    desc: "Pull the live-test JSONL log from the device + sync to admin DB. ITERATION required."
    summary: |
      Usage: go-task -t app-android/Taskfile.yml cohort-test:pull-tests ITERATION=<iid>
      Pulls /sdcard/.../com.musubi.eurio.cohorttest/files/Documents/eurio_live_tests/<iid>.jsonl
      to ml/state/live_test_logs/<iid>.jsonl, then POSTs /lab/cohorts/_/iterations/<iid>/live-tests/sync
      so the admin §5 picks up the fresh results. The ML API must be running
      (e.g. `go-task ml:api:dev`).
    vars:
      ITERATION: '{{.ITERATION}}'
      LOGS_DIR_DEVICE: /sdcard/Android/data/{{.APP_ID}}.cohorttest/files/Documents/eurio_live_tests
      LOGS_DIR_LOCAL: '{{.ROOT_DIR}}/ml/state/live_test_logs'
      ML_API: 'http://127.0.0.1:8042'
    preconditions:
      - sh: 'test -n "{{.ITERATION}}"'
        msg: "ITERATION required (e.g. ITERATION=8a92f1b3)"
    cmds:
      - mkdir -p {{.LOGS_DIR_LOCAL}}
      - adb pull {{.LOGS_DIR_DEVICE}}/{{.ITERATION}}.jsonl {{.LOGS_DIR_LOCAL}}/{{.ITERATION}}.jsonl
      - 'curl -fsS -X POST {{.ML_API}}/lab/cohorts/_/iterations/{{.ITERATION}}/live-tests/sync -H "Content-Type: application/json" -d "{}"'
      - echo "\nSynced. Refresh §5 in /lab/cohorts/<name>/iterations/{{.ITERATION}}."
