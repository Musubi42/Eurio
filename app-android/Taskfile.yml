version: '3'

vars:
  APP_ID: com.musubi.eurio
  MAIN_ACTIVITY: '{{.APP_ID}}/.MainActivity'
  DEBUG_DIR_DEVICE: /sdcard/Android/data/{{.APP_ID}}/files/Documents/eurio_debug
  CAPTURE_DIR_DEVICE: /sdcard/Android/data/{{.APP_ID}}/files/Documents/eurio_capture
  DEBUG_PULL_ROOT: '{{.TASKFILE_DIR}}/../debug_pull'

tasks:
  build:
    desc: Assemble the debug APK
    dir: '{{.TASKFILE_DIR}}/..'
    cmds:
      - ./gradlew :app-android:assembleDebug

  install:
    desc: Build + push APK to the connected device
    dir: '{{.TASKFILE_DIR}}/..'
    cmds:
      - ./gradlew :app-android:installFullDebug

  start:
    desc: Launch the app on the device (does not rebuild)
    cmds:
      - adb shell am start -n {{.MAIN_ACTIVITY}}

  run:
    desc: Install + start (the default dev loop)
    cmds:
      - task: install
      - task: start

  build-qa:
    desc: Assemble the QA APK (with parity state injection)
    dir: '{{.TASKFILE_DIR}}/..'
    cmds:
      - ./gradlew :app-android:assembleQa

  install-qa:
    desc: Build + push QA APK to the connected device
    dir: '{{.TASKFILE_DIR}}/..'
    cmds:
      - ./gradlew :app-android:installQa

  run-qa:
    desc: Install + start QA build
    cmds:
      - task: install-qa
      - adb shell am start -n com.musubi.eurio.qa/.MainActivity

  logs:
    desc: Tail logcat, filtered on Eurio ML tags
    cmds:
      - adb logcat -c
      - adb logcat Eurio:D CoinAnalyzer:D CoinDetector:D ScanVM:D CaptureProtocol:D BenchRecorder:D AndroidRuntime:E '*:S'

  logs-all:
    desc: Tail logcat with no filter
    cmds:
      - adb logcat

  devices:
    desc: List connected adb devices (Wi-Fi or USB)
    cmds:
      - adb devices -l

  pull-debug:
    desc: Pull debug captures from the device into ./debug_pull/TIMESTAMP/
    vars:
      TS:
        sh: date +%Y%m%d_%H%M%S
    cmds:
      - mkdir -p {{.DEBUG_PULL_ROOT}}/{{.TS}}
      - adb pull {{.DEBUG_DIR_DEVICE}}/ {{.DEBUG_PULL_ROOT}}/{{.TS}}/
      - echo "Pulled to {{.DEBUG_PULL_ROOT}}/{{.TS}}/"

  capture:pull:
    desc: Pull only the capture-cohort data (eval_real/) into ./debug_pull/TIMESTAMP/eval_real/
    vars:
      TS:
        sh: date +%Y%m%d_%H%M%S
      # `adb pull <src>/eval_real/ <dest>/` recreates an `eval_real/` dir inside
      # <dest>, so DEST is the timestamp folder (NOT .../eval_real/<ts>) to avoid
      # a double eval_real/eval_real nesting. Mirrors pull-debug ; ml/sync_eval_real
      # auto-detects eval_real/ inside the pulled folder.
      DEST: '{{.DEBUG_PULL_ROOT}}/{{.TS}}'
    cmds:
      - mkdir -p {{.DEST}}
      - adb pull {{.DEBUG_DIR_DEVICE}}/eval_real/ {{.DEST}}/ || echo "no eval_real/ on device"
      - |
        crops=$(find {{.DEST}} -name '*_crop.jpg' 2>/dev/null | wc -l | tr -d ' ')
        coins=$(find {{.DEST}} -mindepth 2 -maxdepth 2 -type d 2>/dev/null | wc -l | tr -d ' ')
        echo "✓ Pulled $crops crops · $coins coins → {{.DEST}}/"
        echo "  Device unchanged. To free the phone once verified:"
        echo "      go-task -t app-android/Taskfile.yml capture:clean"

  capture:clean:
    desc: Delete ONLY the capture-cohort data (eval_real/) on the device
    cmds:
      - adb shell rm -rf {{.DEBUG_DIR_DEVICE}}/eval_real
      - echo "Device eval_real/ cleaned (other debug categories untouched)"

  photo:pull:
    desc: Pull only the rolling photo snaps (photo_snaps/) into ./debug_pull/TIMESTAMP/photo_snaps/
    vars:
      TS:
        sh: date +%Y%m%d_%H%M%S
      DEST: '{{.DEBUG_PULL_ROOT}}/{{.TS}}'
    cmds:
      - mkdir -p {{.DEST}}
      - adb pull {{.DEBUG_DIR_DEVICE}}/photo_snaps/ {{.DEST}}/ || echo "no photo_snaps/ on device"
      - |
        snaps=$(find {{.DEST}}/photo_snaps -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l | tr -d ' ')
        echo "✓ Pulled $snaps photo snaps → {{.DEST}}/photo_snaps/"
        echo "  Device unchanged. To free the phone once verified:"
        echo "      go-task -t app-android/Taskfile.yml photo:clean"

  photo:clean:
    desc: Delete ONLY the rolling photo snaps (photo_snaps/) on the device
    cmds:
      - adb shell rm -rf {{.DEBUG_DIR_DEVICE}}/photo_snaps
      - echo "Device photo_snaps/ cleaned (other debug categories untouched)"

  scan:pull:
    desc: Pull only the scan record sessions (scan_sessions/) into ./debug_pull/TIMESTAMP/scan_sessions/
    vars:
      TS:
        sh: date +%Y%m%d_%H%M%S
      DEST: '{{.DEBUG_PULL_ROOT}}/{{.TS}}'
    cmds:
      - mkdir -p {{.DEST}}
      - adb pull {{.DEBUG_DIR_DEVICE}}/scan_sessions/ {{.DEST}}/ || echo "no scan_sessions/ on device"
      - |
        sessions=$(find {{.DEST}}/scan_sessions -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l | tr -d ' ')
        echo "✓ Pulled $sessions scan sessions → {{.DEST}}/scan_sessions/"
        echo "  Device unchanged. To free the phone once verified:"
        echo "      go-task -t app-android/Taskfile.yml scan:clean"

  scan:clean:
    desc: Delete ONLY the scan record sessions (scan_sessions/) on the device
    cmds:
      - adb shell rm -rf {{.DEBUG_DIR_DEVICE}}/scan_sessions
      - echo "Device scan_sessions/ cleaned (other debug categories untouched)"

  bench:pull:
    desc: Pull bench sessions (chunk-7) from the device into ml/bench/sessions/<device>/
    vars:
      DEVICE_MODEL:
        sh: adb shell getprop ro.product.model | tr -d ' \r'
      DEVICE_DIR: '/sdcard/Android/data/{{.APP_ID}}/files/bench/sessions'
      LOCAL_DIR: '{{.TASKFILE_DIR}}/../ml/bench/sessions/{{.DEVICE_MODEL}}'
    cmds:
      - mkdir -p {{.LOCAL_DIR}}
      - adb pull {{.DEVICE_DIR}}/ {{.LOCAL_DIR}}/ || echo "no bench sessions on device"
      - echo "Pulled bench sessions to {{.LOCAL_DIR}}/"
      - echo "  Device unchanged. To free the phone once verified:"
      - echo "      go-task -t app-android/Taskfile.yml bench:clean"

  bench:clean:
    desc: Delete ONLY the bench sessions (bench/) on the device — separate root from eurio_debug
    cmds:
      - adb shell rm -rf /sdcard/Android/data/{{.APP_ID}}/files/bench
      - echo "Device bench/ cleaned (eurio_debug categories untouched)"

  push-capture-csv:
    desc: Push a cohort capture CSV to the device, then force-stop the app so the new list is picked up on next launch
    summary: |
      Usage: go-task -t app-android/Taskfile.yml push-capture-csv CSV=ml/state/cohort_csvs/<slug>.csv
      Path is relative to the repo root (TASKFILE_DIR/..). Absolute paths also accepted.
      Generated by the admin "Cohort capture flow" — see docs/admin/cohort-capture-flow/design.md
    vars:
      CSV: '{{.CSV}}'
      CSV_ABS:
        sh: |
          p="{{.CSV}}"
          case "$p" in
            /*) echo "$p" ;;
            *)  echo "{{.TASKFILE_DIR}}/../$p" ;;
          esac
    preconditions:
      - sh: 'test -n "{{.CSV}}"'
        msg: "CSV var required: pass CSV=<path> on the command line"
      - sh: 'test -f "{{.CSV_ABS}}"'
        msg: "CSV file not found: {{.CSV}} (resolved to {{.CSV_ABS}})"
    cmds:
      - adb shell mkdir -p {{.CAPTURE_DIR_DEVICE}}
      - adb push {{.CSV_ABS}} {{.CAPTURE_DIR_DEVICE}}/cohort.csv
      - adb shell am force-stop {{.APP_ID}}
      - echo "Pushed {{.CSV}} → {{.CAPTURE_DIR_DEVICE}}/cohort.csv. Re-launch the app to pick up the new cohort."

  clean-debug:
    desc: Delete all debug captures on the device
    cmds:
      - adb shell rm -rf {{.DEBUG_DIR_DEVICE}}
      - echo "Device debug dir cleaned"

  clean:
    desc: Gradle clean for app-android
    dir: '{{.TASKFILE_DIR}}/..'
    cmds:
      - ./gradlew :app-android:clean

  stop:
    desc: Force-stop the app on the device
    cmds:
      - adb shell am force-stop {{.APP_ID}}

  parity:capture:
    desc: Run all Maestro parity flows and capture screenshots
    dir: '{{.TASKFILE_DIR}}/..'
    deps: [install-qa]
    cmds:
      - |
        for f in admin/packages/parity/flows/*.yaml; do
          maestro test --test-output-dir admin/packages/parity/screenshots/android "$f"
        done

  parity:capture-scene:
    desc: Capture a single scene (go-task android:parity:capture-scene -- vault-home)
    dir: '{{.TASKFILE_DIR}}/..'
    cmds:
      - maestro test --test-output-dir admin/packages/parity/screenshots/android admin/packages/parity/flows/{{.CLI_ARGS}}.yaml

  snapshot:
    desc: Export a fresh catalog_snapshot.json from Supabase into assets/
    # TASKFILE_DIR is always app-android/ regardless of how this file is
    # invoked (root taskfile include vs `-t app-android/Taskfile.yml`).
    # ROOT_DIR varies, so don't use it here.
    dir: '{{.TASKFILE_DIR}}/../ml'
    cmds:
      - .venv/bin/python -m export.export_catalog_snapshot

  snapshot-dry:
    desc: Preview the catalog snapshot (counts + size) without writing
    dir: '{{.TASKFILE_DIR}}/../ml'
    cmds:
      - .venv/bin/python -m export.export_catalog_snapshot --dry-run

  prod:assets:promote:
    desc: "Refresh prod APK assets from ml/prod/current/ (post-promotion). Phase 4."
    summary: |
      Usage: go-task -t app-android/Taskfile.yml prod:assets:promote
      Copies the model + embeddings + meta from ml/prod/current/ into
      app-android/src/main/assets/{models,data}/. Refuses with a clear
      error if no promotion has happened yet (run `python -m
      scripts.promote_iteration <iid>` first).
    dir: '{{.TASKFILE_DIR}}/../ml'
    cmds:
      - .venv/bin/python -m scripts.promote_prod_assets

  prod:assets:promote-dry:
    desc: Preview prod:assets:promote without touching the filesystem
    dir: '{{.TASKFILE_DIR}}/../ml'
    cmds:
      - .venv/bin/python -m scripts.promote_prod_assets --dry-run

  cohort-test:bundle:
    desc: "Build the cohortTest APK bundle (model + filtered catalog + manifests). COHORT + ITERATION required."
    summary: |
      Usage: go-task -t app-android/Taskfile.yml cohort-test:bundle COHORT=<name> ITERATION=<iid>
      Drops 6 files into app-android/src/cohortTest/assets/cohort_bundle/ so the
      next assembleCohortTestDebug picks them up. Cf. docs/training-pipeline/sprint-3-cohort-test-app.md.
    vars:
      COHORT: '{{.COHORT}}'
      ITERATION: '{{.ITERATION}}'
      # Use TASKFILE_DIR (always app-android/) instead of ROOT_DIR
      # (varies: monorepo-root when invoked via `go-task android:...`,
      # app-android/ when invoked via `-t app-android/Taskfile.yml`).
      OUT: '{{.TASKFILE_DIR}}/../ml/output/cohort_test_{{.ITERATION}}'
      BUNDLE_DIR: '{{.TASKFILE_DIR}}/src/cohortTest/assets/cohort_bundle'
    preconditions:
      - sh: 'test -n "{{.COHORT}}" && test -n "{{.ITERATION}}"'
        msg: "COHORT and ITERATION required (e.g. COHORT=green-v1 ITERATION=8a92f1b3)"
    cmds:
      - cd {{.TASKFILE_DIR}}/../ml && .venv/bin/python -m scripts.build_cohort_bundle --source lab --cohort {{.COHORT}} --iteration {{.ITERATION}} --out {{.OUT}}
      - rm -rf {{.BUNDLE_DIR}}
      - mkdir -p {{.BUNDLE_DIR}}
      - cp {{.OUT}}/* {{.BUNDLE_DIR}}/
      - echo "Bundle staged at {{.BUNDLE_DIR}}"

  cohort-test:bundle:prod:
    desc: "Build the cohortTest APK bundle from prod/current/ (no iteration). COHORT required."
    summary: |
      Usage: go-task -t app-android/Taskfile.yml cohort-test:bundle:prod COHORT=<name>
      Build a bundle that mirrors what the prod APK ships, scoped to the
      given cohort. Useful to A/B-test prod vs a candidate iteration on
      device. Reads from ml/prod/current/ (run `python -m scripts.promote_iteration`
      first if it doesn't exist). Phase 4 (lab-prod-refacto).
    vars:
      COHORT: '{{.COHORT}}'
      OUT: '{{.TASKFILE_DIR}}/../ml/output/cohort_test_prod_{{.COHORT}}'
      BUNDLE_DIR: '{{.TASKFILE_DIR}}/src/cohortTest/assets/cohort_bundle'
    preconditions:
      - sh: 'test -n "{{.COHORT}}"'
        msg: "COHORT required (e.g. COHORT=green-v1)"
    cmds:
      - cd {{.TASKFILE_DIR}}/../ml && .venv/bin/python -m scripts.build_cohort_bundle --source prod --cohort {{.COHORT}} --out {{.OUT}}
      - rm -rf {{.BUNDLE_DIR}}
      - mkdir -p {{.BUNDLE_DIR}}
      - cp {{.OUT}}/* {{.BUNDLE_DIR}}/
      - echo "Prod bundle staged at {{.BUNDLE_DIR}}"

  cohort-test:install:
    desc: "Bundle + build + install the cohortTest APK on the device. COHORT + ITERATION required."
    summary: |
      Usage: go-task -t app-android/Taskfile.yml cohort-test:install COHORT=<name> ITERATION=<iid>
      Runs cohort-test:bundle then assembles + installs the cohortTest debug APK.
      The cohortTest applicationId is com.musubi.eurio.cohorttest, which cohabits
      with the prod com.musubi.eurio install on the same device.
    deps: [cohort-test:bundle]
    dir: '{{.TASKFILE_DIR}}/..'
    cmds:
      - ./gradlew :app-android:installCohortTestDebug
      - adb shell am force-stop {{.APP_ID}}.cohorttest
      - echo "Installed. Open 'Eurio Test' on the device."

  cohort-test:pull-tests:
    desc: "Pull the live-test JSONL log from the device + sync to admin DB. ITERATION required."
    summary: |
      Usage: go-task -t app-android/Taskfile.yml cohort-test:pull-tests ITERATION=<iid>
      Pulls /sdcard/.../com.musubi.eurio.cohorttest/files/Documents/eurio_live_tests/<iid>.jsonl
      to ml/state/live_test_logs/<iid>.jsonl, then POSTs /lab/cohorts/_/iterations/<iid>/live-tests/sync
      so the admin §5 picks up the fresh results. The ML API must be running
      (e.g. `go-task ml:api:dev`).
    vars:
      ITERATION: '{{.ITERATION}}'
      LOGS_DIR_DEVICE: /sdcard/Android/data/{{.APP_ID}}.cohorttest/files/Documents/eurio_live_tests
      LOGS_DIR_LOCAL: '{{.TASKFILE_DIR}}/../ml/state/live_test_logs'
      ML_API: 'http://127.0.0.1:8042'
    preconditions:
      - sh: 'test -n "{{.ITERATION}}"'
        msg: "ITERATION required (e.g. ITERATION=8a92f1b3)"
    cmds:
      - mkdir -p {{.LOGS_DIR_LOCAL}}
      - adb pull {{.LOGS_DIR_DEVICE}}/{{.ITERATION}}.jsonl {{.LOGS_DIR_LOCAL}}/{{.ITERATION}}.jsonl
      - 'curl -fsS -X POST {{.ML_API}}/lab/cohorts/_/iterations/{{.ITERATION}}/live-tests/sync -H "Content-Type: application/json" -d "{}"'
      - echo "\nSynced. Refresh §5 in /lab/cohorts/<name>/iterations/{{.ITERATION}}."
