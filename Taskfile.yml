version: '3'

includes:
  android:
    taskfile: ./app-android/Taskfile.yml
    dir: .
  ml:
    # Fichier nommé `tasks.yml` (PAS `Taskfile.yml`) exprès : go-task n'auto-découvre
    # que `Taskfile.yml`. En le renommant, `go-task ml:<task>` marche depuis la racine
    # ET depuis n'importe quel sous-dossier (go-task remonte l'arbo jusqu'à CE fichier
    # racine sans se faire court-circuiter par un Taskfile.yml dans ml/).
    taskfile: ./ml/tasks.yml
    dir: ./ml

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list-all
    silent: true

  backup:stage:
    desc: "Produit le staging de sauvegarde (snapshots VACUUM INTO des bases + manifeste). C'est ce que Duplicati ramasse."
    cmds:
      - ./infra/backup/eurio-backup.sh stage

  backup:verify:
    desc: "Vérifie les invariants du staging (transport, structure, plausibilité). Sort en 2 sur anomalie. Ajouter -- --accept-baseline pour acquitter une décroissance légitime."
    cmds:
      - ./infra/backup/eurio-backup.sh verify {{.CLI_ARGS}}

  backup:test:
    desc: "Test NÉGATIF de la suite d'invariants : vérifie qu'elle sait dire non (base tronquée, base vide, schéma désaligné…)."
    cmds:
      - ./infra/backup/test_verify.sh

  backup:drill:
    desc: "Exercice de restauration COMPLET (~1 h 15) : clone Codeberg → build des images → restauration pCloud → stack isolée → invariants. Ne touche pas la production. Étape précise : -- <clone|build|pick|restore|up|smoke>."
    cmds:
      - ./infra/backup/drill/run-drill.sh {{.CLI_ARGS | default "all"}}

  backup:drill:status:
    desc: "Où en est l'exercice de restauration en cours (étapes franchies, version Duplicati retenue, conteneurs -drill)."
    cmds:
      - ./infra/backup/drill/run-drill.sh status

  backup:drill:down:
    desc: "Détruit la stack d'exercice et son répertoire jetable. À lancer même après un échec — sinon 13 Go restent sur le disque."
    cmds:
      - ./infra/backup/drill/run-drill.sh down

  secrets:edit:
    desc: "Éditer les secrets (secrets/dev.env). Déchiffre dans $EDITOR, re-chiffre à la sauvegarde. SOURCE UNIQUE de tous les secrets."
    cmds:
      - sops secrets/dev.env

  secrets:check:
    desc: "Vérifie que secrets/dev.env est déchiffrable (clé age présente) et bien formé. À lancer après un changement de machine/recipient."
    cmds:
      - 'sops -d secrets/dev.env > /dev/null && echo "✅ secrets/dev.env déchiffrable et valide"'
    silent: true

  secrets:list:
    desc: "Liste les NOMS des secrets présents dans dev.env (valeurs jamais affichées)."
    cmds:
      - 'sops -d secrets/dev.env | grep -E "^[A-Za-z_][A-Za-z0-9_]*=" | cut -d= -f1 | sort'
    silent: true

  tokens:generate:
    desc: Regenerate platform theme files from shared/tokens.css (R2). --target <nom> pour une seule cible
    cmds:
      - node scripts/generate_tokens.mjs {{.CLI_ARGS}}

  tokens:targets:
    desc: List the platforms the token generator can emit for
    cmds:
      - node scripts/generate_tokens.mjs --help

  front:dev:
    desc: "Lance le front admin studio-local (HMR, port 5173). Mode local par défaut (PAT + ML lourd :8042 actif) — cf. CLAUDE.md §Architecture frontend."
    # Le PAT vient de l'environnement shell (VITE_EURIO_PAT, aliasé sur
    # EURIO_API_TOKEN par .envrc — source unique secrets/dev.env). Aucun .env.local.
    preconditions:
      - sh: '[ -n "$VITE_EURIO_PAT" ]'
        msg: "VITE_EURIO_PAT absent — lance depuis le shell direnv du repo (secrets/dev.env → EURIO_API_TOKEN). `direnv reload` si besoin."
    cmds:
      - pnpm -C admin/packages/studio-local dev

  front:build:
    desc: Build le front admin studio-local (typecheck + vite build)
    cmds:
      - pnpm -C admin/packages/studio-local build

  front:typecheck:
    desc: Typecheck seul du front admin studio-local (vue-tsc --noEmit)
    cmds:
      - pnpm -C admin/packages/studio-local typecheck

  front:preview:
    desc: Preview du build studio-local (vite preview)
    cmds:
      - pnpm -C admin/packages/studio-local preview

  proto:dev:
    desc: Serve the Vue proto (HMR, port 5174) for human design audit
    cmds:
      - pnpm -C admin/packages/proto dev

  proto:build:
    desc: Build the Vue proto to dist/ (typecheck + vite build)
    cmds:
      - pnpm -C admin/packages/proto build

  proto:deploy:
    desc: "Régénère le catalogue depuis eurio.db, build le proto, déploie en prebuilt sur Vercel prod (zéro build cloud — plan gratuit). Pré-requis 1 fois : cd admin/packages/proto && vercel login && vercel link"
    cmds:
      # 1. Catalogue complet (app_core.json) régénéré depuis eurio.db — la donnée
      #    est gitignorée, donc on doit la produire en local AVANT de packager.
      - task: ml:build-app-core
      # 2. Build statique du proto (typecheck + vite build → dist/).
      - pnpm -C admin/packages/proto build
      # 3. Emballage Build Output API v3 puis deploy prebuilt. Hash routing
      #    (createWebHashHistory) → pas de rewrite SPA, statique pur suffit.
      #    On ne touche pas à .vercel/project.json (le lien créé par vercel link).
      - |
        cd admin/packages/proto
        rm -rf .vercel/output
        mkdir -p .vercel/output/static
        cp -R dist/. .vercel/output/static/
        printf '{"version":3}\n' > .vercel/output/config.json
        vercel deploy --prebuilt --prod

  parity:capture-proto:
    desc: Capture proto parity screenshots (self-contained — builds QA bundle, dist, serves, captures)
    cmds:
      # Bundle QA hermétique figé (app_core_qa.json + webps locaux) consommé en mode parité.
      - task: ml:build-app-core-qa
      - pnpm -C admin/packages/parity capture:proto

  parity:capture-admin:
    desc: Capture admin console screenshots (requires admin web dev server on :5173)
    cmds:
      - pnpm -C admin/packages/parity capture:admin

  tokens:check:
    desc: Fail if a generated theme file has drifted from shared/tokens.css (R2 guard)
    cmds:
      # --check n'écrit rien et ne dépend pas de git : marche sur un arbre sale,
      # hors dépôt, et en CI le jour où il y en aura une.
      # Sortie 2 = dérive, 1 = erreur de parsing/IO.
      - node scripts/generate_tokens.mjs --check

  augment-textures-generate:
    desc: Procedurally (re)generate overlay textures (patina/dust/scratches/fingerprints)
    dir: ./ml
    cmds:
      - ./.venv/bin/python training/generate_overlay_textures.py {{.CLI_ARGS}}

  filament:install-matc:
    desc: Download Filament toolchain (matc) into ./tools/filament/. Pinned to v1.71.0 to match the runtime shipped in SceneView 4.0.0. Auto-detects OS (linux x86_64 / mac universal).
    vars:
      FILAMENT_VERSION: v1.71.0
    cmds:
      - mkdir -p tools/filament
      - |
        if [ -x tools/filament/bin/matc ]; then
          echo "matc already installed: $(tools/filament/bin/matc --version 2>&1 | head -1)"
          exit 0
        fi
        case "$(uname -s)" in
          Darwin) asset="filament-{{.FILAMENT_VERSION}}-mac.tgz" ;;
          Linux)  asset="filament-{{.FILAMENT_VERSION}}-linux.tgz" ;;
          *) echo "Unsupported OS: $(uname -s)" >&2; exit 1 ;;
        esac
        echo "Downloading $asset..."
        curl -L --fail -o tools/filament.tgz \
          "https://github.com/google/filament/releases/download/{{.FILAMENT_VERSION}}/$asset"
        tar -xzf tools/filament.tgz -C tools/filament --strip-components=1
        rm tools/filament.tgz
        echo "matc installed: $(tools/filament/bin/matc --version 2>&1 | head -1)"

  filament:compile-materials:
    desc: Compile *.mat sources in app-android/src/main/materials/ to *.filamat in assets/materials/. Run automatically by Gradle preBuild — invoke manually only when iterating on a material.
    cmds:
      - |
        if [ ! -x tools/filament/bin/matc ]; then
          echo "matc not found. Run: go-task filament:install-matc" >&2
          exit 1
        fi
        mkdir -p app-android/src/main/assets/materials
        for src in app-android/src/main/materials/*.mat; do
          [ -f "$src" ] || continue
          name=$(basename "${src%.mat}")
          out="app-android/src/main/assets/materials/${name}.filamat"
          tools/filament/bin/matc -p mobile -a opengl -o "$out" "$src"
          echo "  $src → $out"
        done

  augment-textures-check:
    desc: Validate that overlay textures are present and readable
    dir: ./ml
    cmds:
      - ./.venv/bin/python -c 'from training.augmentations.overlays import sanity_check_textures; import sys; sys.exit(sanity_check_textures())'

  # ccproxy est un service GLOBAL partagé entre projets (~/Taskfile.yml,
  # namespace global:ccproxy:*), plus une instance locale à Eurio. Ces tâches
  # délèguent — pas de code Go ni de port local ici. Voir ~/.claude/CLAUDE.md
  # §Services globaux locaux et bizz/CCPROXY-GLOBAL-MIGRATION.md.
  ccproxy:start:
    desc: "Démarre ccproxy global (port 3042, idempotent, background)."
    cmds:
      - task -g global:ccproxy:start

  ccproxy:status:
    desc: "État du ccproxy global (up/down + PID + port)."
    cmds:
      - task -g global:ccproxy:status

  ccproxy:health:
    desc: "Payload /health brut du ccproxy global."
    cmds:
      - task -g global:ccproxy:health

  # ─── loan ─────────────────────────────────────────────────────────────────
  # Extrait du monorepo le 2026-08-14 (ADR-006) vers ../loan, dépôt séparé.
  # Ses tâches (build-catalog, dev, env-check, deploy) vivent désormais dans
  # son propre Taskfile. Transition de l'alimentation Supabase → MinIO :
  # voir ../loan/docs/migration-vers-minio.md
