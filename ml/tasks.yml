version: "3"

vars:
  VENV: "{{.TASKFILE_DIR}}/.venv/bin"
  DATASET: "{{.TASKFILE_DIR}}/datasets/eurio-poc"
  CHECKPOINTS: "{{.TASKFILE_DIR}}/checkpoints"
  OUTPUT: "{{.TASKFILE_DIR}}/output"
  ASSETS: "{{.TASKFILE_DIR}}/../app-android/src/main/assets"

tasks:
  # ---------- Bootstrap ----------
  venv-rebuild:
    desc: "Force-rebuild .venv from scratch (use when the Nix devShell hash changed and the venv's pyvenv.cfg points to a stale store path)."
    cmds:
      - rm -rf .venv
      - uv venv --system-site-packages
      - uv pip install --python .venv/bin/python -e .
      - "{{.VENV}}/python -c 'import boto3, sys; print(f\"boto3 {boto3.__version__}  exe={sys.executable}\")'"

  setup:
    desc: "Bootstrap .venv (idempotent). Creates a system-site-packages venv inheriting Nix devShell deps, then installs editable package + per-platform torch."
    cmds:
      - |
        if [ ! -f .venv/pyvenv.cfg ] || ! grep -q "include-system-site-packages = true" .venv/pyvenv.cfg; then
          echo "Recreating .venv with --system-site-packages…"
          rm -rf .venv
          python3 -m venv --system-site-packages .venv
        fi
      - uv pip install --python .venv/bin/python -e .
      - "{{.VENV}}/python -c 'import torch; print(f\"torch {torch.__version__}  cuda={torch.cuda.is_available()}  mps={torch.backends.mps.is_available()}\")'"

  # ---------- Full pipeline ----------
  default:
    desc: Run the full ML pipeline (prepare → train → export → deploy)
    cmds:
      - task: prepare
      - task: train
      - task: evaluate
      - task: visualize
      - task: export
      - task: validate
      - task: embeddings
      - task: deploy
      - task: seed

  # ---------- Eval-real (device golden set) ----------
  eval-real:sync:
    desc: "Normalize the device-pulled eval_real/ snaps into datasets/eval_real_norm/ (ADDITIF : n'efface rien, les classes déjà présentes sont conservées). Usage: go-task ml:eval-real:sync -- <debug_pull_dir>"
    cmds:
      - "{{.VENV}}/python -m vision.sync_eval_real {{.CLI_ARGS}}"

  eval-real:sync:clear:
    desc: "⚠️ DESTRUCTIF — même chose mais EFFACE d'abord tout datasets/eval_real_norm/. À n'utiliser que pour repartir d'un set propre à partir d'un pull complet : lancé sur UN seul debug_pull, il détruit les captures normalisées de tous les autres. Usage: go-task ml:eval-real:sync:clear -- <debug_pull_dir>"
    cmds:
      - "{{.VENV}}/python -m vision.sync_eval_real {{.CLI_ARGS}} --clear"

  eval-real:eval:
    desc: "Per-snap eval against deployed centroids (output/embeddings_v1.json). Pass --from-checkpoint-W to compare against the raw ArcFace W."
    cmds:
      - "{{.VENV}}/python -m vision.eval_real_snaps {{.CLI_ARGS}}"

  scan:diff:
    desc: "Validate the Kotlin SnapNormalizer port against Python normalize_snap on a debug pull. Usage: go-task ml:scan:diff -- <debug_pull_dir> [--write-diff]"
    cmds:
      - "{{.VENV}}/python -m vision.diff_kotlin_python {{.CLI_ARGS}}"

  scan:bench-normalize:
    desc: "Sandbox bench: time normalize_studio / normalize_device on a stratified sample, with cross-algo parity stats. Usage: go-task ml:scan:bench-normalize -- [--per-bucket N] [--variants studio,device]"
    cmds:
      - "{{.VENV}}/python -m tests.bench_normalize {{.CLI_ARGS}}"

  scan:measure-baseline:
    desc: "Measure cross-algo dispersion (normalize_studio ↔ normalize_device) on the parity manifest, and recommend ε / M_max thresholds."
    cmds:
      - "{{.VENV}}/python -m tests.measure_parity_baseline --manifest tests/parity_dataset.yaml --datasets datasets --out-dir tests/_parity_out {{.CLI_ARGS}}"

  scan:parity-test:
    desc: "Cross-algo parity gate. Exits non-zero if too many images diverge between normalize_studio and normalize_device (ε on Hough-OK subset, pct_diff on full manifest)."
    cmds:
      - "{{.VENV}}/python -m tests.parity_test --manifest tests/parity_dataset.yaml --datasets datasets --out-dir tests/_parity_out {{.CLI_ARGS}}"

  scan:test-dispatch:
    desc: "Unit tests for the normalize_snap public API (constants, dispatch, fallback tagging)."
    cmds:
      - "{{.VENV}}/python -m pytest tests/test_normalize_dispatch.py -v"

  # ---------- Foundation (DINOv2 anchors for auto-validation) ----------
  dino-anchors:build:
    desc: "Build DINOv2 obverse anchor bank for the auto-validation pipeline. Kinds: 2eur_commemo (consensus, vits14), 2eur_standard (design groups courantes, vits14), 2eur_all (commémo+standards, banque des suggestions review, ENCODÉE EN vitl14 — MULTI-EXEMPLAIRES depuis improvement-loop B : canonique + ~10 vrais crops validés choisis par diversité FPS, overrides pin/exclude honorés, sélection tracée dans dino_class_references). Reads coins from eurio.db and ml/datasets/<numista>/obverse.jpg (+ crops eBay validés pour 2eur_all). Écrit DEUX fichiers aux rôles distincts : foundation_anchors_<kind>__<encodeur>.npz = l'artefact de banc (toujours écrit, un par couple kind×encodeur, lu seulement par qui demande un encodeur explicite) et foundation_anchors_<kind>.npz = la banque SERVIE que la review lit (slot unique par kind, écrite sur intention explicite du CLI). --no-serve bâtit l'artefact SANS toucher la banque servie : c'est ce qu'il faut pour un bras baseline de banc, dinov2-vitl14 étant à la fois l'encodeur servi et le bras de référence. Sans ce drapeau la banque servie est remplacée — comportement voulu d'un rebuild de prod, et journalisé (WARNING avec les comptes avant/après). Écriture atomique : un build interrompu ne laisse plus un .npz tronqué à la place de la banque servie. La ligne de sortie n'annonce que les fichiers VÉRIFIÉS sur disque. AMORCE DU FPS (O6, 2eur_all) : --seed-order medoid (défaut) retient d'abord le MÉDOÏDE de chaque classe ; --seed-order fps retient d'abord le crop le plus lointain du canonique (ancien comportement, mesuré -4 pts à taille de banque égale : 73,8 % contre 77,8 % en vitl14). La note du build (dino_anchor_builds.note) dit laquelle a servi : amorce=medoide|fps. Usage: go-task ml:dino-anchors:build [-- --force] [-- --kind 2eur_all] [-- --no-serve] [-- --seed-order fps]. Après un renommage de slugs : rebâtir 2eur_commemo ET 2eur_all --force PUIS re-backfiller les prédictions. ⚠️ AVANT le premier build d'un encodeur CANDIDAT, la migration 0010 doit être appliquée au canonique (redémarrage de eurio-api sur le VPS, cf. le commentaire en tête de la section « Banc multi-encodeurs ») : sans elle, l'encodeur n'est pas dans la clé de dino_class_references et le build candidat ÉCRASE les références de la production (M1). Le writer refuse désormais d'écrire sur une table à l'ancienne clé — le refus est bruyant et nomme 0010. ⚠️ PLANCHER D'EXEMPLAIRES (2eur_all) : une classe entre en banque avec >= min_exemplars exemplaires ou avec son canonique SEUL. ⛔ LE DÉFAUT EST 1, C'EST-À-DIRE PLANCHER INACTIF (depuis le 2026-08-20 au soir) : il a valu 2 pendant une journée, sur la lecture du point N=1 de la courbe held-out (50,1 % contre 53,1 % à N=0) — lecture FAUSSE, ce point signifie « toutes les classes plafonnées à 1 », pas « ces 68 classes-ci à 1 ». La mesure restreinte a réfuté la prémisse : donner à 57 classes exactement UN exemplaire améliore leurs propres crops (vitl14 67,6 -> 69,1 %, p=0,048 ; vits14 41,6 -> 45,5 %, p=4,5e-10), et le creux agrégé vient de l'ORDRE du FPS, pas du nombre (--rank-order last rend 77,8 % contre 73,8 % en vitl14, à nombre d'ancres identique). Le mécanisme reste ENTIER et testé : reposer 2 est une ligne dans dino_thresholds. ⚠️ LA BANQUE SERVIE AUJOURD'HUI PORTE ENCORE LE PLANCHER (build 365dcab2a253, 68 classes ramenées au canonique seul) : LE PROCHAIN REBUILD CHANGERA SA FORME — ces classes retrouveront leur exemplaire — ET LE GARDE P1 NE LE DIRA PAS (il compte les classes à >= 2 exemplaires, compte invariant par ce retour). Le seuil est résolu EN BASE, sur la base pointée par --db : sous Direction A c'est la RÉPLIQUE, alors qu'il s'écrit au canonique — une valeur posée par le PO n'atteint le build qu'après un pull de réplique. Le journal et dino_anchor_builds.note disent la valeur, son état (ACTIF/INACTIF) ET sa provenance (source=db|code) : c'est là qu'on vérifie, pas dans la commande. Le compte de classes ramenées au canonique seul ne se prédit PAS depuis un compte de pool (ce qui décide est la sortie du FPS) : le chiffre qui fait foi est celui de la note du build. ⚠️ 2eur_all TRACE sa sélection en base : sous le devShell (EURIO_DB_READONLY=1) la commande refuse de démarrer — relancer avec EURIO_DB_READONLY= , ou --skip-references pour le .npz seul."
    cmds:
      - "{{.VENV}}/python -m scripts.build_dino_anchors -v {{.CLI_ARGS}}"

  dino-anchors:test:
    desc: "Unit tests for ml/foundation/ (encoder + anchors + matcher, smoke + roundtrip)."
    cmds:
      - "{{.VENV}}/python -m pytest tests/test_foundation.py -v"

  dino-predictions:backfill:
    desc: >-
      Recalcule les top-K DINO de chaque crop du périmètre dans
      image_asset_dino_predictions. Kinds : 2eur_commemo (défaut, consensus) |
      2eur_all (suggestions review : 2€ commémo + courantes) | 2eur_standard.
      Idempotent sans --force (les crops déjà prédits sont sautés) ; --force les
      recalcule, ce qu'il FAUT après un rebuild de banque — sinon la file de
      review continue de trier sur des vecteurs de l'ancienne banque.
      QUELLE BASE : jamais un chemin codé en dur. Sous --push (ACTIF par défaut
      dès que EURIO_API_URL est configurée, donc dans le devShell) le script
      pull une réplique scratch NEUVE du canonique et travaille dessus — --db
      est alors ignoré, et il le dit maintenant dans un warning. Sous --no-push
      il ouvre EURIO_DB_PATH (la réplique locale sous Direction A), repli hors
      devShell state/eurio.replica.db ; l'écriture y est refusée bruyamment,
      c'est voulu (règle de repli : docstring de store.resolve_db_path).
      COMMENT ON SAIT QUE C'EST COMPLET — quatre lignes, dans l'ordre :
      (1) « anchor bank 2eur_all loaded (N anchors …) » avec N = la banque
      courante (1533 au build 23c637d93b43 du 2026-08-19 ; 1250 = banque
      périmée, arrêter) ; (2) « backfill: N candidate assets in scope 2eur_all »
      avec N ≈ 12454, JAMAIS ≈ 6205 — 6205 est la base de travail périmée, c'est
      le témoin direct du défaut de chemin corrigé le 2026-08-19 ; (3)
      « Predicted: N   Errors: 0 » avec Skipped=0 sous --force ; (4) la ligne de
      push « → n ligne(s) appliquée(s) au canonique » — sans elle rien n'est
      tracé. Contre-vérification, réplique à jour :
      sqlite3 "file:ml/state/eurio.replica.db?mode=ro" "SELECT COUNT(*) FROM
      image_asset_dino_predictions WHERE anchors_kind='2eur_all';" → 12454.
      Durée ⚠️ estimation (extrapolée de 4 et 60 assets sur MPS, ~84 ms/asset) :
      ≈ 18 min pour 12454, plus le pull (~106 Mo).
      Usage: go-task ml:dino-predictions:backfill [-- --kind 2eur_all] [-- --force] [-- --limit 50] [-- --no-push]
    cmds:
      - "{{.VENV}}/python -m scripts.backfill_dino_predictions -v {{.CLI_ARGS}}"

  # ─── Banc multi-encodeurs (docs/work-in-progress/banque-dino/PROTOCOLE-BENCH.md) ───
  # Le banc compare des encodeurs GELÉS sur NOS crops. Ordre des gestes :
  # bench-gold:build (figer le jeu) → encoder-bench:run (mesurer) → lire les
  # résultats sur /lab/encoder-bench/runs. Tant que P1 (rebuild de banque) et P3
  # (backfill des prédictions) ne sont pas passés, tout chiffre de calibration
  # sort marqué `provisional` — c'est voulu, pas un bug.
  # État au 2026-08-19 : P1 est PASSÉ au canonique (build 23c637d93b43 —
  # 671 classes / 1533 ancres / 182 classes à exemplaires, contre 664/1250/125).
  # La réplique locale affiche encore 1250/125 tant qu'elle n'a pas rattrapé :
  # c'est Direction A, pas une régression, et le bloqueur P1 reste donc levé
  # en local. P3 n'est PAS passé (`dino-predictions:backfill --force`).
  #
  # ⚠️ DEUX MIGRATIONS ATTENDENT LE VPS — 0009 (tables du banc) et 0010
  # (l'encodeur entre dans la clé primaire de `dino_class_references`, défaut
  # M1). Il n'existe PAS de tâche go-task qui les applique : elles sont jouées
  # par `serving/db_migrate.run_migrations` au DÉMARRAGE du conteneur
  # canonique. Le geste, humain, est celui de la skill `eurio-vps-deploy` :
  #   cd /opt/eurio && git pull
  #   cd infra/eurio-api && direnv exec /opt/eurio docker compose up -d --build
  # Contrôle après redémarrage (le compte doit être INCHANGÉ) :
  #   SELECT encoder_version, method, COUNT(*) FROM dino_class_references
  #    GROUP BY 1,2;   -- attendu : dinov2-vitl14|canonical|671 et …|fps|862
  # ⚠️ À faire AVANT le premier `dino-anchors:build` d'un encodeur CANDIDAT :
  # sans 0010, ce build écrase les références de la production (M1). Répétition
  # faite le 2026-08-20 sur copie /tmp de la réplique via le vrai runner :
  # 1250 lignes avant, 1250 après, 4 index présents, `foreign_key_check` vide.
  bench-gold:build:
    desc: "P4 — fige le jeu d'évaluation du banc (crops décidés en review) dans state/validation_gold/encoder_bench_gold.jsonl + son sidecar .meta.json, et calcule son gold_version. Mesuré le 2026-08-19 sur la réplique : 1958 crops / 194 eurio_id / 188 class_id / gold_version=0ecbb1d70e3c. Le défaut de --db suit EURIO_DB_PATH (la réplique sous Direction A), pas state/eurio.db en dur. LECTURE SEULE en base. La version hache asset_id|truth_eurio_id|class_id — une re-décision humaine la fait donc bouger (D2) ; le pays du gold (truth_country) vient de decided_eurio_id, jamais de la cible du scrape (D6). ⚠️ Le manifeste est COMMITTÉ : sans lui, deux machines ne comparent pas le même jeu. Refuse d'écraser un gold existant sans --force (il affiche d'abord le diff, y compris les class_id changés). Un gold d'un schéma antérieur est refusé bruyamment, pas chargé de travers. Usage: go-task ml:bench-gold:build [-- --force] [-- --db state/eurio.replica.db]"
    cmds:
      - "{{.VENV}}/python -m scripts.bench_gold build {{.CLI_ARGS}}"

  bench-gold:show:
    desc: "Résume le gold figé : nombre de crops, de classes, part non training_eligible, et combien de crops ont un class_id de banque différent de leur eurio_id (repli sur le représentant de groupe de dessin — 105 crops au 2026-08-19 ; les ignorer plafonnerait le recall à 94,6 % sur TOUS les encodeurs, sans rien signaler). Usage: go-task ml:bench-gold:show"
    cmds:
      - "{{.VENV}}/python -m scripts.bench_gold show {{.CLI_ARGS}}"

  bench-gold:diff:
    desc: "Compare le gold figé à ce que la base rendrait AUJOURD'HUI (la file de review bouge). À lancer avant d'interpréter un vieux run : si le diff est gros, les runs d'avant et d'après ne sont pas comparables et il faut refiger (bench-gold:build --force) puis tout rejouer. Usage: go-task ml:bench-gold:diff"
    cmds:
      - "{{.VENV}}/python -m scripts.bench_gold diff {{.CLI_ARGS}}"

  encoder-bench:run:
    desc: "Ré-encode la banque 2eur_all ET les crops du GOLD FIGÉ (bench-gold:build) avec chaque encodeur candidat, imprime recall@1/@5 global + bande pays + McNemar apparié contre le bras de référence, et POUSSE le run dans encoder_bench_runs par POST /ingest/encoder-bench (Direction A — aucune écriture locale). Spécifier les modèles : noms torch.hub DINOv2 (dinov2_vits14, dinov2_vitl14) ou timm:<model> (DINOv3, TinyViT…). N'ÉCRIT PAS dans les .npz. Lourd : GPU/MPS, plusieurs minutes par encodeur. ⚠️ Le garde de calibration est maintenant DANS le chemin exécutable : les bloqueurs P1/P3 sont mesurés par store.encoder_bench.calibration_blockers et la bannière ⚠ CALIBRATION PROVISOIRE s'imprime en tête ET en pied, plus dans le rapport --out. Tant qu'un bloqueur tient, AUCUN seuil n'est rendu (--allow-provisional rend le chiffre marqué « provisoire » — mais la colonne provisional en base ne suit jamais l'option). ⚠️ Depuis la fermeture de M2, c'est le CANONIQUE qui tranche `provisional`, pas le banc : store.encoder_bench.record_run refuse d'écrire provisional=0 dans une base qui mesure des bloqueurs, et POST /ingest/encoder-bench remesure sur SA connexion (bloqueurs, plus n_paired recompté par paired_overlap), corrige dans le sens sûr (0 → 1) et renvoie provisional/blockers/corrections. Le banc imprime alors « ⚠ CORRIGÉ PAR LE CANONIQUE : … » — la bannière locale est calculée sur la réplique, EN RETARD sous Direction A, donc un désaccord est normal et se lit sur cette ligne, pas dans la bannière. P3 ne bloque PAS la comparaison : le banc ré-encode tout, les recall sortent, seul spread_at_p97 est retenu. Un run non tracé (sync coupée, POST en erreur) sort en code 1 et dépose son payload rejouable dans state/encoder_bench_pending/ ; --no-push est la façon explicite de ne pas tracer. Usage: go-task ml:encoder-bench:run [-- --models dinov2_vitl14 timm:vit_small_patch16_dinov3.lvd1689m] [-- --baseline dinov2_vitl14] [-- --limit 200] [-- --gold <jsonl>] [-- --allow-provisional] [-- --no-push] [-- --note '…'] [-- --out bench.md]"
    cmds:
      - "{{.VENV}}/python -m scripts.bench_encoder_dino {{.CLI_ARGS}}"

  encoder-bench:test:
    desc: "Tests du banc multi-encodeurs : gold figé (P4), scoping des banques par encodeur et rôle servi ↔ artefact de banc (P6-1/P6-2), store + route d'ingest encoder_bench_* (P6-5), balayage de seuils et McNemar apparié (P6-3/P6-4), câblage du banc lui-même (gold lu, bannière, seuil refusé, run poussé), miroir migration ↔ schema.sql, convention de repli de base des CLI (store.resolve_db_path — le défaut du 2026-08-19 qui a fait bâtir la banque sur un demi-corpus), l'encodeur DANS la clé de dino_class_references + la migration 0010 (M1), et la FAMILLE du garde de calibration : invariant dans record_run + inventaire AST des chemins qui écrivent un run (M2 — un cinquième chemin fait rougir le test). Rapide, aucun modèle chargé — bench_encoder_dino y est exercé avec son encodage doublé."
    cmds:
      - "{{.VENV}}/python -m pytest tests/test_bench_gold.py tests/test_anchor_encoder_scope.py tests/test_anchor_bank_serving.py tests/test_bench_encoder_dino.py tests/test_encoder_bench_store.py tests/test_ingest_encoder_bench.py tests/test_threshold_sweep.py tests/test_threshold_calibration.py tests/test_paired_stats.py tests/test_schema_mirror.py tests/test_db_path_defaults_cli.py tests/test_dino_refs_encoder_key.py tests/test_encoder_bench_guard_family.py -v"

  refs-curve:run:
    desc: "Étape 3 du chantier scan-sans-retrain — la courbe « combien de références wild par classe ? ». Sous-échantillonne la banque 2eur_all EN MÉMOIRE par le rang FPS de dino_class_references (canoniques + fps de rang ≤ N) au lieu de la rebâtir N fois : un seul encodage des 1533 ancres + 1958 crops du gold figé, ~1 min en vits14 / ~7 min en vitl14. LECTURE SEULE — ni base, ni .npz, ni push. ⚠️ 858 des 1958 crops du gold SONT des lignes de la banque : les noter contre elle mesure une similarité de 1,0 avec eux-mêmes. Le script les EXCLUT (1100 crops held-out / 72 classes) ; --include-leaked ajoute la courbe fuitée pour chiffrer l'écart (mesuré : vits14 85,9 % fuitée contre 75,5 % honnête à N=10), jamais comme mesure. DEUX LECTURES séparées, jamais mélangées : population VARIABLE (toutes les classes held-out, plafonnées à ce qu'elles ont — ce que vit l'utilisateur) et population CONSTANTE (les 52 classes held-out à 10 exemplaires — ce qui isole l'effet du nombre). Le garde check_bank_matches_build refuse de mesurer si le .npz et le build tracé divergent. ⚠️ C'est la tâche REVIEW (photos de vendeurs eBay) ; la courbe du SCAN exige le corpus de capture, encore vide. ⚠️ IL N'Y A PAS DE PLATEAU MESURÉ : « coude à N=8 » (annoncé ici jusqu'au 2026-08-20) était un artefact du maillage 5/8/10 — sur 4..10 le détecteur ne trouve plus rien, 8→9 est du bruit (z=0,50) et 9→10 reste significatif (+1,36 pt, z=2,54). Viser 8 est un arbitrage de budget, pas une lecture de plateau (COURBE §3.5). ⚠️ UN PALIER N SIGNIFIE « TOUTES LES CLASSES PLAFONNÉES À N », JAMAIS « CES CLASSES-CI À N, LES AUTRES PLEINES ». Le script ne connaît pas min_exemplars (défaut S6) : il tronque par rang FPS. C'est exactement cette confusion qui a fait poser le plancher min_exemplars=2 le 2026-08-20 (retiré le soir même). Il mesure le rendement d'un exemplaire de plus, il ne prédit pas la forme d'une banque réelle. ✅ POUR POSER LA QUESTION PAR CLASSE, trois drapeaux depuis le 2026-08-20 : --bank-classes @fichier (le plafond N ne s'applique QU'À ces class_id, les autres gardent toute leur banque), --gold-classes @fichier (seuls ces crops sont notés ; un ensemble vide est REFUSÉ, il ne vaut pas « aucune restriction »), --rank-order last (garde les rangs FPS les MOINS diversifiants — sonde de mécanisme, ne correspond à AUCUN build possible : ne cite jamais son chiffre comme une prédiction). Chaque palier porte en outre sa p-value de McNemar exact (shared/stats/paired.py) contre le palier précédent : un écart sans sa p-value ne se cite pas. Résultats : docs/work-in-progress/scan-sans-retrain/COURBE-REFERENCES.md. Usage: go-task ml:refs-curve:run [-- --model dinov2_vitl14] [-- --refs 0 1 2 3 5 8 10] [-- --include-leaked] [-- --bank-classes @classes.txt] [-- --gold-classes @classes.txt] [-- --rank-order last] [-- --out courbe.md] [-- --json courbe.json]"
    cmds:
      - "{{.VENV}}/python -m scripts.bench_refs_curve {{.CLI_ARGS}}"

  refs-curve:test:
    desc: "Tests du protocole de la courbe de références : sous-échantillonnage par rang FPS, garde .npz ↔ dino_anchor_builds, séparation des deux populations et exclusion des crops fuités, détection du coude (y compris le creux réel à N=1, qui fait rendre « coude à N=0 » à un détecteur naïf), et les restrictions --bank-classes / --gold-classes / --rank-order (plafond limité aux classes demandées, absence de restriction identique au comportement historique, classe inconnue sans effet, order inconnu refusé, ensemble VIDE refusé au lieu de passer pour « aucune restriction »). Aucun modèle chargé, ~1,4 s."
    cmds:
      - "{{.VENV}}/python -m pytest tests/test_refs_curve.py -v"

  backfill-face:
    desc: "C7 — Détecte la face (avers vs revers commun 2€) sur les crops face IS NULL, rejette les revers (ré-ouvrables) et re-route les listings touchés (bucket funnel 'revers commun 2€'). Idempotent. Usage: go-task ml:backfill-face [-- --limit 200] [-- --dry]"
    cmds:
      - "{{.VENV}}/python -m scripts.backfill_face -v {{.CLI_ARGS}}"

  backfill-denom:
    desc: "C7 pilier 2 — Gate dénomination (probe DINO) sur les crops LOT denom IS NULL : audit d'abord (denom + denom_2eur_score écrits, routes inchangées). Le rejet not_2eur (ré-ouvrable) + re-route funnel se déclenche avec --reject APRÈS validation PO. Idempotent. Usage: go-task ml:backfill-denom [-- --run 059dc8d] [-- --limit 200] [-- --dry] ; puis go-task ml:backfill-denom -- --reject"
    cmds:
      - "{{.VENV}}/python -m scripts.backfill_denom -v {{.CLI_ARGS}}"

  bench-denom-probe:
    desc: "C7 pilier 2 — Replay du gate dénomination déployé (state/denom_probe.npz, seuil embarqué) sur le gold denom_gold.jsonl via le chemin d'inférence prod : rappel 2€ / capture junk / précision rejet, par conf et par kind. Test de régression rejouable (l'éval honnête out-of-fold reste scripts.train_denom_probe). Usage: go-task ml:bench-denom-probe [-- --threshold 0.42]"
    cmds:
      - "{{.VENV}}/python -m scripts.bench_denom_probe {{.CLI_ARGS}}"

  text-signals:backfill:
    desc: "Extract listing text signals (countries/years/denoms/themes/markers/lot/coverage) for every source_image without a row in listing_text_signals. Pure regex/dict, no I/O. Idempotent. Usage: go-task ml:text-signals:backfill [-- --force] [-- --limit 50] [-- --source ebay]"
    cmds:
      - "{{.VENV}}/python -m scripts.backfill_text_signals -v {{.CLI_ARGS}}"

  backfill-source-status:
    desc: "Dérive coin_source_status (state=ok + axes) depuis la donnée existante, par source. Aucun réseau, idempotent, ne touche pas les verdicts réseau. Usage: go-task ml:backfill-source-status [-- --force] [-- --db PATH]"
    cmds:
      - "{{.VENV}}/python -m scripts.backfill_coin_source_status -v {{.CLI_ARGS}}"

  backfill-detections:
    desc: "Persiste source_images.detections_json (detect_circles_multi complet) pour les listings déjà scrapés → review lot instantanée (plus de recompute live). Listing-only, idempotent. Usage: go-task ml:backfill-detections [-- --run-id ID] [-- --force] [-- --dry] [-- --limit N]"
    cmds:
      - "{{.VENV}}/python -m scripts.backfill_detections_json {{.CLI_ARGS}}"

  sweep-bce-empty:
    desc: "Sème empty_upstream pour les commémos 2€ récentes que la BCE n'a pas (encore) publiées. Itère par année (respecte le rate-limit), idempotent, manuel. Usage: go-task ml:sweep-bce-empty [-- --min-year 2024 --dry-run]"
    cmds:
      - "{{.VENV}}/python -m scripts.sweep_bce_empty_upstream -v {{.CLI_ARGS}}"

  bench:export-batch:
    desc: "Theme-matcher bench (P0) — sample listings from a real run into a JSONL batch to label + a groups.json context file. Usage: go-task ml:bench:export-batch [-- --run b6bede99 --sample 200]"
    cmds:
      - "{{.VENV}}/python -m scripts.bench_theme_match export {{.CLI_ARGS}}"

  bench:ingest-labels:
    desc: "Theme-matcher bench (P0) — merge batch.jsonl + labels.jsonl into the frozen gold theme_match_gold.jsonl."
    cmds:
      - "{{.VENV}}/python -m scripts.bench_theme_match ingest {{.CLI_ARGS}}"

  bench:theme-match:
    desc: "Theme-matcher bench (P0) — replay the current matcher on the frozen gold, print recall / precision / false-discard / auto-attribution. Quota-free. Usage: go-task ml:bench:theme-match [-- -v]"
    cmds:
      - "{{.VENV}}/python -m scripts.bench_theme_match replay {{.CLI_ARGS}}"

  bench:enrich-images:
    desc: "Studio bench — enrich the frozen gold with each listing's eBay image URL into gold_images.jsonl (kept listings free from source_images, rejected re-fetched via Browse API getItem). One-time, idempotent. Usage: go-task ml:bench:enrich-images [-- --dry]"
    cmds:
      - "{{.VENV}}/python -m scripts.enrich_bench_images {{.CLI_ARGS}}"

  aliases:mine-acronyms:
    desc: "Theme-matcher C2a — mine acronym aliases from i18n titles' parentheses into coin_aliases (e.g. 'European Monetary Institute (EMI)' → emi). Idempotent. Usage: go-task ml:aliases:mine-acronyms [-- --dry]"
    cmds:
      - "{{.VENV}}/python -m scripts.mine_coin_aliases {{.CLI_ARGS}}"

  aliases:export-batch:
    desc: "Theme-matcher C2a-2 — export the coin batch (i18n titles + group sisters) to enrich with LLM market-vocabulary aliases. Default scope BE 2017-2021. Usage: go-task ml:aliases:export-batch [-- --country BE --years 2017-2021]"
    cmds:
      - "{{.VENV}}/python -m scripts.llm_coin_aliases export-batch {{.CLI_ARGS}}"

  aliases:ingest:
    desc: "Theme-matcher C2a-2 — ingest aliases_llm.jsonl into coin_aliases (source='llm') with anti-collision guard against group sisters. Idempotent. Usage: go-task ml:aliases:ingest [-- --dry]"
    cmds:
      - "{{.VENV}}/python -m scripts.llm_coin_aliases ingest {{.CLI_ARGS}}"

  # ---------- Individual steps ----------
  prepare:
    desc: Resize images and split into train/val/test (legacy design_group label space)
    cmds:
      - "{{.VENV}}/python training/prepare_dataset.py --class-kind design_group"
    sources:
      - datasets/*/
    generates:
      - datasets/eurio-poc/train/*/
      - datasets/eurio-poc/val/*/
      - datasets/eurio-poc/test/*/

  train:
    desc: "Train the coin model (default: classification mode)"
    deps: [prepare]
    cmds:
      - >-
        {{.VENV}}/python training/train_embedder.py
        --mode classify
        --dataset {{.DATASET}}/train
        --val-dataset {{.DATASET}}/val
    generates:
      - checkpoints/best_model.pth
      - checkpoints/training_log.json

  train-arcface:
    desc: "Train ArcFace embedder (metric learning)"
    deps: [prepare]
    cmds:
      - >-
        {{.VENV}}/python training/train_embedder.py
        --mode arcface
        --dataset {{.DATASET}}/train
        --val-dataset {{.DATASET}}/val
        --epochs 40
        --batch-size 256
        --m-per-class 4
        --num-workers 4
    generates:
      - checkpoints/best_model.pth
      - checkpoints/training_log.json

  augment:
    desc: "Generate augmented images for training coins"
    cmds:
      - "{{.VENV}}/python training/augment_synthetic.py --coin-ids 135 111 159 87 226447 --target-per-class 50"

  # ⚠️ Tasks below intentionally have NO `deps: [train]`.
  # In practice training is launched via the admin /training UI (which lets
  # you stage classes, pick aug_recipe overrides, etc.) — auto-running the
  # default `train` task here would overwrite the user's arcface checkpoint
  # with a classify-mode one. Run `train` / `train-arcface` explicitly when
  # you want a fresh checkpoint.

  evaluate:
    desc: Evaluate Recall@1/3 on the test set (requires existing best_model.pth)
    cmds:
      - "{{.VENV}}/python eval/evaluate.py"

  visualize:
    desc: Generate t-SNE plot and training curves (requires existing best_model.pth)
    cmds:
      - "{{.VENV}}/python eval/visualize.py"
    generates:
      - output/tsne_plot.png
      - output/training_curves.png

  export:
    desc: Export PyTorch model to TFLite (requires existing best_model.pth)
    cmds:
      - "{{.VENV}}/python training/export_tflite.py"
    generates:
      - output/eurio_embedder_v1.tflite

  validate:
    desc: Verify TFLite output matches PyTorch (cosine sim > 0.99) — requires prior `export`
    cmds:
      - "{{.VENV}}/python training/validate_export.py"

  validate-per-class:
    desc: "Per-class R@1 over 50 fresh augmentations — same eval as the runner's step 5"
    cmds:
      - "{{.VENV}}/python training/validate_per_class.py {{.CLI_ARGS}}"

  embeddings:
    desc: Compute reference centroid embeddings per coin class (requires existing best_model.pth)
    cmds:
      - "{{.VENV}}/python training/compute_embeddings.py"
    generates:
      - output/embeddings_v1.json
      - output/coin_embeddings.json

  deploy:
    desc: Copy TFLite model and metadata into Android assets
    cmds:
      - mkdir -p {{.ASSETS}}/models {{.ASSETS}}/data
      - cp {{.OUTPUT}}/eurio_embedder_v1.tflite {{.ASSETS}}/models/
      - cp {{.OUTPUT}}/model_meta.json {{.ASSETS}}/data/
      - "[ -f {{.OUTPUT}}/coin_embeddings.json ] && cp {{.OUTPUT}}/coin_embeddings.json {{.ASSETS}}/data/ || true"

  seed:
    desc: Seed Supabase with coin catalog and embeddings (needs SERVICE_ROLE_KEY)
    deps: [embeddings]
    cmds:
      - "{{.VENV}}/python bootstrap/seed_supabase.py"

  # ---------- Utilities ----------
  clean:
    desc: Remove generated artifacts (checkpoints, output, split dataset)
    cmds:
      - rm -rf {{.CHECKPOINTS}} {{.OUTPUT}} {{.DATASET}}

  export-app-supabase:
    desc: "Push the app-facing Supabase schema v2 (all tables, FK-safe order). Requires SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY."
    cmds:
      - "{{.VENV}}/python -m export.app_export.run --apply {{.CLI_ARGS}}"

  export-app-supabase:dry:
    desc: "Dry-run: print per-table row counts and a sample row (no network)."
    cmds:
      - "{{.VENV}}/python -m export.app_export.run --dry-run {{.CLI_ARGS}}"

  export-app-obverse:
    desc: "Upload each coin's avers (national side) to Storage + populate coin_image (empties bucket first)."
    cmds:
      - "{{.VENV}}/python -m export.upload_app_obverse --apply {{.CLI_ARGS}}"

  export-app-obverse:dry:
    desc: "Dry-run: resolve best obverse source per coin, print plan (no network)."
    cmds:
      - "{{.VENV}}/python -m export.upload_app_obverse --dry-run"

  build-shared-reverse-assets:
    desc: "Build the packaged common-side (carte v1/v2) WebP assets for the APK."
    cmds:
      - "{{.VENV}}/python -m export.build_shared_reverse_assets"

  build-app-core:
    desc: "Build the offline core (C3) depuis le CANONIQUE → app_core.json (proto) + app_core.db (Android prebuilt SQLite). Aucun réseau : une panne de Supabase ne bloque plus le build."
    cmds:
      - "{{.VENV}}/python -m export.build_app_core {{.CLI_ARGS}}"

  build-app-core:verify:
    desc: "Idem, mais vérifie en plus que le core produit est inclus dans la projection Supabase (C3 ⊆ C2). Sort en 3 sur violation, en 4 si Supabase est injoignable."
    cmds:
      - "{{.VENV}}/python -m export.build_app_core --verify {{.CLI_ARGS}}"

  build-app-core-qa:
    desc: "Build the QA core (3rd profile): hermetic frozen subset from eurio.db → app_core_qa.json + bundled webps + Android src/qa SQLite. Offline, no Supabase."
    cmds:
      - "{{.VENV}}/python -m export.build_app_core_qa"

  sync-supabase:
    desc: "Push the canonical referential JSON to Supabase (coins, source_observations, coin_market_prices, …)"
    cmds:
      - "{{.VENV}}/python -m export.sync_to_supabase {{.CLI_ARGS}}"

  sync-supabase-dry:
    desc: "Preview the sync (counts only, no HTTP)"
    cmds:
      - "{{.VENV}}/python -m export.sync_to_supabase --dry-run"

  enrich-numista:
    desc: "Enrich referential with Numista IDs (hardcoded 5 ML coins)"
    cmds:
      - "{{.VENV}}/python referential/enrich_from_numista.py"

  enrich-numista-dry:
    desc: "Preview Numista enrichment without writing"
    cmds:
      - "{{.VENV}}/python referential/enrich_from_numista.py --dry-run"

  # batch-match / batch-match-dry retirés 2026-05-23 : la génération directe
  # referential_catalog → coins (chunk 2 harmonisation) a rendu le matcher
  # flou inutile. Cf. docs/data-harmonization/.

  batch-images:
    desc: "Fetch/resize/upload images for all coins with numista_id but no images"
    cmds:
      - "{{.VENV}}/python referential/batch_fetch_images.py"

  batch-images-dry:
    desc: "Preview batch image fetch"
    cmds:
      - "{{.VENV}}/python referential/batch_fetch_images.py --dry-run"

  import-numista:
    desc: "Import all 2 euro coins from Numista API (metadata + images)"
    cmds:
      - "{{.VENV}}/python referential/import_numista.py"

  import-numista-dry:
    desc: "Preview Numista import without downloading"
    cmds:
      - "{{.VENV}}/python referential/import_numista.py --dry-run"

  migrate-v2:
    desc: "V1→V2 referential migration: deverse coins.cross_refs into coin_source_refs (Chunk 2c)"
    cmds:
      - "{{.VENV}}/python referential/migrate_to_v2.py --apply"

  migrate-v2-dry:
    desc: "Preview V1→V2 migration counts without writing (cf. docs/research/referential-v2.md)"
    cmds:
      - "{{.VENV}}/python referential/migrate_to_v2.py --dry-run"

  apply-3a-dry:
    desc: "Chunk 3a — Preview creating ~99 new commemo Types (joint-issues design_groups bootstrap)"
    cmds:
      - "{{.VENV}}/python referential/apply_3a_new_types.py --dry-run"

  apply-3a:
    desc: "Chunk 3a — Apply CREATE_NEW_TYPE × 99 commemos (uses Supabase upsert, idempotent)"
    cmds:
      - "{{.VENV}}/python referential/apply_3a_new_types.py --apply"

  apply-3b-dry:
    desc: "Chunk 3b — Preview rematch of IN_REF_WRONG (47 rematches + 21 null+needs_review)"
    cmds:
      - "{{.VENV}}/python referential/apply_3b_rematch.py --dry-run"

  apply-3b:
    desc: "Chunk 3b — Apply rematch + null+needs_review (PATCH coins, swap coin_source_refs)"
    cmds:
      - "{{.VENV}}/python referential/apply_3b_rematch.py --apply"

  apply-3c-dry:
    desc: "Chunk 3c — Preview MOVE_TO_VARIANT × 15 + UNCERTAIN absorbed × 2 (3 buckets, peuple coin_variants)"
    cmds:
      - "{{.VENV}}/python referential/apply_3c_move_to_variant.py --dry-run"

  apply-3c:
    desc: "Chunk 3c — Apply Bucket A (rematch+variant ×8), Bucket B (variant ×7), Bucket C (UNCERTAIN rematch ×2)"
    cmds:
      - "{{.VENV}}/python referential/apply_3c_move_to_variant.py --apply"

  apply-3d-dry:
    desc: "Chunk 3d — Preview ADD_AS_VARIANT × 25 (re-match parents via overlap_score, B2 parent creation)"
    cmds:
      - "{{.VENV}}/python referential/apply_3d_add_as_variant.py --dry-run"

  apply-3d:
    desc: "Chunk 3d — Apply Bucket A (variant + bascule cross_refs si classic), B1 (NL EU Flag variants), B2 (parent + variant)"
    cmds:
      - "{{.VENV}}/python referential/apply_3d_add_as_variant.py --apply"

  apply-3f-dry:
    desc: "Chunk 3f — Preview standards orphans × 15 (Numista redesigns non capturés par V1)"
    cmds:
      - "{{.VENV}}/python referential/apply_3f_standards.py --dry-run"

  apply-3f:
    desc: "Chunk 3f — Apply standards orphans × 15 (nouveaux Types pour redesigns portrait/carte)"
    cmds:
      - "{{.VENV}}/python referential/apply_3f_standards.py --apply"

  apply-3e-flag-dry:
    desc: "Chunk 3e.1 — Preview flagging des 7 IN_REF_UNCERTAIN non-absorbés en needs_review=true"
    cmds:
      - "{{.VENV}}/python referential/apply_3e_flag_uncertain.py --dry-run"

  apply-3e-flag:
    desc: "Chunk 3e.1 — Apply needs_review=true sur 7 V1 slots (UNCERTAIN audit, non absorbés par 3c)"
    cmds:
      - "{{.VENV}}/python referential/apply_3e_flag_uncertain.py --apply"

  apply-3e-enrich-dry:
    desc: "Chunk 3e.2 — Preview backfill review_action_hint + review_payload pour les 32 needs_review coins"
    cmds:
      - "{{.VENV}}/python referential/apply_3e_enrich_context.py --dry-run"

  apply-3e-enrich:
    desc: "Chunk 3e.2 — Apply review_action_hint + review_payload (suppose migration 20260516 appliquée)"
    cmds:
      - "{{.VENV}}/python referential/apply_3e_enrich_context.py --apply"

  # ---------- Market & editorial scrapes ----------
  scrape-ebay:
    desc: "⛔ SUPPRIMÉE — panneau indicateur. market/scrape_ebay.py n'existe plus. La bonne porte est ml:src:ebay:run (elle pose EURIO_CENSUS_RECOVER=1, OFF par défaut, qui récupère ~77 % du parc bimétal sous-croppé). Échoue exprès."
    silent: true
    cmds:
      - |
        cat >&2 <<'EOF'
        ⛔ go-task ml:scrape-ebay n'existe plus (market/scrape_ebay.py a été supprimé).

           Pour scraper eBay, utilise :
             go-task ml:src:ebay:run  -- --target-eurio-ids <id1>,<id2> --push
             go-task ml:src:ebay:dry  -- ...   (découverte seule, aucun téléchargement)
             go-task ml:src:ebay:status

           N'appelle PAS `python -m sources.cli` en direct : la tâche pose
           EURIO_CENSUS_RECOVER=1, OFF par défaut. Sans elle, une grosse part
           des raws bimétal repart en zero_crops, en silence.

           Détail : .claude/skills/eurio-enrichment/SKILL.md
        EOF
        exit 1

  scrape-lmdlp:
    desc: "Scrape La Maison de la Pièce 2€ catalogue → ml/datasets/sources/lmdlp_<date>.json"
    cmds:
      - "{{.VENV}}/python referential/scrape_lmdlp.py"

  scrape-mdp:
    desc: "Scrape Monnaie de Paris 2€ catalogue → ml/datasets/sources/mdp_<date>.json"
    cmds:
      - "{{.VENV}}/python referential/scrape_monnaiedeparis.py"

  scrape-bce:
    desc: "Pipeline BCE complet (fs-as-SOT) — fetch + crop + sidecar + manifest. Args : --year, --target, --country, --dry-run, --force."
    cmds:
      - "{{.VENV}}/python -m sources.bce.cli {{.CLI_ARGS}}"

  scrape-jo:
    desc: "Pipeline JO/EUR-Lex — énumère les avis JO série C (pièces commémo 2€) via CELLAR SPARQL, parse, écrit image côté national + date d'émission + URL annonce. Args : --since, --country, --target, --dry-run, --force."
    cmds:
      - "{{.VENV}}/python -m sources.jo.cli {{.CLI_ARGS}}"

  scrape-wikipedia-coins:
    desc: "Énumère par pièce les 2€ commémo de nl.wikipedia (Lijst, un tableau/année) → table wikipedia_nl_coins (pays, année, thème, eurio_id matché). Couche « attendu » de la matrice de couverture. Args : --dry-run, --unmatched."
    cmds:
      - "{{.VENV}}/python -m referential.scrape_wikipedia_coins {{.CLI_ARGS}}"

  fetch-bce-images:
    desc: "Download + upload BCE coin images (always — coexists with Numista)"
    cmds:
      - "{{.VENV}}/python referential/fetch_bce_images.py {{.CLI_ARGS}}"

  scrape-bce-i18n:
    desc: "Récolte titres + descriptions officiels BCE dans les 24 langues UE → coin_descriptions_i18n. Args : --year, --langs, --dry-run."
    cmds:
      - "{{.VENV}}/python -m referential.scrape_bce_i18n {{.CLI_ARGS}}"

  scrape-bce-facts:
    desc: "Récolte tirage + date d'émission BCE (lang-invariants, page EN) → coin_observations (mintage_official, issuing_date) + cross-check vs Numista. Args : --year, --dry-run."
    cmds:
      - "{{.VENV}}/python -m referential.scrape_bce_facts {{.CLI_ARGS}}"

  migrate-storage-layout:
    desc: "One-shot: migrate coin-images bucket to per-eurio_id layout (--plan / --apply / --apply --prune)"
    cmds:
      - "{{.VENV}}/python -m bootstrap.migrate_storage_layout {{.CLI_ARGS}}"

  # ---------- Detection (YOLOv8-nano) ----------
  # Note : la préparation du dataset via Roboflow a été retirée (source non
  # utilisée). Le dataset vit sous ml/datasets/detection/coin_detect.
  detect-train:
    desc: "Train YOLOv8-nano coin detector"
    cmds:
      - "{{.VENV}}/python training/train_detector.py --export"

  detect-validate:
    desc: "Validate trained detector"
    cmds:
      - "{{.VENV}}/python training/train_detector.py --validate"

  detect-export:
    desc: "Export detector to TFLite only"
    cmds:
      - "{{.VENV}}/python training/train_detector.py --export-only"

  migrate-dirs:
    desc: "Rename dataset dirs from slug names to Numista IDs"
    cmds:
      - "{{.VENV}}/python bootstrap/rename_to_numista_ids.py"

  # ---------- Training state (SQLite) ----------
  export-state-lite:
    desc: "Export training state DB only (portable history/staging) → tar.gz in CWD"
    cmds:
      - "{{.VENV}}/python -m state.archive export --mode lite {{.CLI_ARGS}}"

  export-state-full:
    desc: "Export state + datasets + checkpoints + embeddings → tar.gz (500MB-1GB)"
    cmds:
      - "{{.VENV}}/python -m state.archive export --mode full {{.CLI_ARGS}}"

  import-state:
    desc: "Import a state tarball. Usage: go-task ml:import-state -- path.tar.gz"
    cmds:
      - "{{.VENV}}/python -m state.archive import {{.CLI_ARGS}}"

  prune-history:
    desc: "Keep only the last N runs. Usage: go-task ml:prune-history -- --keep-last 100"
    cmds:
      - "{{.VENV}}/python -m state.archive prune {{.CLI_ARGS}}"

  # ---------- DB réplique (Modèle B, R2) ----------
  # Le canonique vit sur le VPS derrière `eurio-api` (writer unique). Le calcul
  # lourd tire une réplique read-only DIRECTEMENT du VPS (snapshot VACUUM INTO
  # cohérent), bosse en local, puis pousse ses runs via `/ingest/run` (--push).
  # Plus de lease/MinIO pour la DB (retiré en R2 — MinIO ne garde que les images).
  db:pull-replica:
    desc: "Rafraîchit la réplique locale depuis le canonique VPS. Transport auto : sqlite3_rsync incrémental (pages modifiées seules, ~3 s) via la clé dédiée ~/.ssh/eurio_replica, fallback GET /db/replica (complet, vérif sha). Lecture seule : aucune op locale à perdre (Direction A pousse directement au VPS via POST /ingest/*)."
    cmds:
      - "{{.VENV}}/python -m client.replica {{.CLI_ARGS}}"

  lab:push-dimensions:
    desc: "Backfill F09 : pousse toutes les cohortes PUIS itérations lab locales au canonique VPS (upsert par id, idempotent, ordre parent→enfant). Exige EURIO_API_URL distant. Usage: go-task ml:lab:push-dimensions [-- --dry]"
    cmds:
      - "{{.VENV}}/python -m scripts.push_lab_dimensions {{.CLI_ARGS}}"

  # ---------- Review collaborative (service VPS + pont eurio.db) ----------
  # Service review = review.db SQLite + FastAPI, hors lease (toujours allumé sur
  # le VPS). publish/reconcile = pont avec eurio.db (lease requis, côté Mac).
  # cf. docs/work-in-progress/collaborative-review/
  review:serve:
    desc: "Lance le service review en local (uvicorn :8048, reload) pour le dev."
    cmds:
      - "{{.VENV}}/python -m uvicorn review_service.app:app --port 8048 --reload"

  review:reviewer:add:
    desc: "Ajoute un reviewer. Usage: go-task ml:review:reviewer:add -- --token Paolo42 --name Paolo"
    cmds:
      - "{{.VENV}}/python -m review_service.manage add-reviewer {{.CLI_ARGS}}"

  review:reviewer:list:
    desc: "Liste les reviewers de review.db."
    cmds:
      - "{{.VENV}}/python -m review_service.manage list-reviewers"

  review:publish:
    desc: "Pousse les items open (lane manuel) eurio.db → service review. Usage: [-- --limit 200]"
    cmds:
      - "{{.VENV}}/python -m review.publish_cli publish {{.CLI_ARGS}}"

  review:reconcile:
    desc: "Tire les décisions des amis → staging eurio.db.peer_review_decisions."
    cmds:
      - "{{.VENV}}/python -m review.publish_cli reconcile"

  # ---------- API quotas ----------
  quota:status:
    desc: "Dump quota usage as JSON. Usage: go-task ml:quota:status -- --source=numista"
    cmds:
      - "{{.VENV}}/python -m shared.api_quota_cli {{.CLI_ARGS}}"

  # ---------- ML API ----------
  api:
    desc: "Start the ML training API (FastAPI on port 8042)"
    cmds:
      - "{{.VENV}}/python -m uvicorn serving.server:app --port 8042 --reload"

  api-prod:
    desc: "Start the ML API without reload"
    cmds:
      - "{{.VENV}}/python -m uvicorn serving.server:app --port 8042"

  # api-replica / api-replica-prod SUPPRIMÉES (local-sync 2026-07). Le mode
  # unique est « local + sync » : state/eurio.db seedée du canonique (bootstrap
  # one-shot, cf. docs/work-in-progress/local-sync/) + worker debounce qui
  # pousse/tire les events autoritatifs. Pour une vraie run train/bench :
  # api-prod (--reload tue les subprocess ET relance le worker à chaque edit).

  lab:clean-orphans:
    desc: "Supprime les artefacts disque d'itérations lab orphelines (plus en DB). Dry-run par défaut ; ajouter -- --apply pour supprimer. Filet pour les runs morts (subprocess tué)."
    cmds:
      - "{{.VENV}}/python -m scripts.clean_lab_orphans {{.CLI_ARGS}}"

  # ---------- Confusion Map ----------
  confusion-map:
    desc: "Generate coin confusion map via DINOv2 and upsert to Supabase"
    cmds:
      - "{{.VENV}}/python eval/confusion_map.py"

  confusion-map-dry:
    desc: "Dry-run confusion map computation (no DB writes)"
    cmds:
      - "{{.VENV}}/python eval/confusion_map.py --dry-run"

  # ---------- Design Groups ----------
  bootstrap-design-groups:
    desc: "Bootstrap design_groups + populate coins.design_group_id (axis A auto, axis B seed)"
    cmds:
      - "{{.VENV}}/python bootstrap/bootstrap_design_groups.py --apply"

  bootstrap-design-groups-dry:
    desc: "Preview design_groups bootstrap without writing"
    cmds:
      - "{{.VENV}}/python bootstrap/bootstrap_design_groups.py"

  audit-obverse-groups:
    desc: "Gate derive-then-diff des design_groups STANDARD par avers (lecture seule). Ex: go-task ml:audit-obverse-groups -- --country BE"
    cmds:
      - "{{.VENV}}/python -m scripts.audit_obverse_groups {{.CLI_ARGS}}"

  bootstrap-obverse-groups-dry:
    desc: "Preview bootstrap design_groups par avers (aucune écriture). Ex: go-task ml:bootstrap-obverse-groups-dry -- --country BE"
    cmds:
      - "{{.VENV}}/python -m bootstrap.obverse_groups {{.CLI_ARGS}}"

  bootstrap-obverse-groups:
    desc: "Applique le bootstrap design_groups par avers en base (backup DB d'abord). Ex: go-task ml:bootstrap-obverse-groups -- --country BE"
    cmds:
      - 'cp "{{.TASKFILE_DIR}}/state/eurio.db" "{{.TASKFILE_DIR}}/state/eurio.db.bak-pre-obverse-$(date +%Y%m%dT%H%M%S)"'
      - "{{.VENV}}/python -m bootstrap.obverse_groups --apply {{.CLI_ARGS}}"

  review-obverse-vision:
    desc: "Review vision Claude de la cohérence des design_groups par avers (ccproxy user-owned requis). Ex: go-task ml:review-obverse-vision -- --country BE"
    cmds:
      - "{{.VENV}}/python -m scripts.review_obverse_groups_vision {{.CLI_ARGS}}"

  report-obverse-volume:
    desc: "Rapport volume eBay par classe avers vs cible ~100 (lecture seule). Ex: go-task ml:report-obverse-volume -- --country BE"
    cmds:
      - "{{.VENV}}/python -m scripts.report_obverse_group_volume {{.CLI_ARGS}}"

  eval-obverse-attribution:
    desc: "Éval vision du filtrage eBay → groupe avers (lecture seule, ccproxy). Ex: go-task ml:eval-obverse-attribution -- --country BE --per-group 8"
    cmds:
      - "{{.VENV}}/python -m scripts.eval_obverse_attribution_vision {{.CLI_ARGS}}"

  gate-standard-vision:
    desc: "Gate vision : rejette les commémos/junk leakées dans le standard scrape (dry-run par défaut ; --apply pour écrire ; ccproxy). Ex: go-task ml:gate-standard-vision -- --country BE --apply"
    cmds:
      - "{{.VENV}}/python -m scripts.gate_standard_vision {{.CLI_ARGS}}"

  # ---------- Phase 2 Augmentation ----------
  augment-preview:
    desc: "Generate a preview grid of augmented images for a design (takes --design-group-id or --eurio-id)"
    cmds:
      - "{{.VENV}}/python eval/preview_augmentations.py {{.CLI_ARGS}}"

  augment-textures-check:
    desc: "Validate that overlay textures are present and readable"
    cmds:
      - "{{.VENV}}/python -c 'from augmentations.overlays import sanity_check_textures; import sys; sys.exit(sanity_check_textures())'"

  augment-textures-generate:
    desc: "Procedurally (re)generate overlay textures (patina/dust/scratches/fingerprints)"
    cmds:
      - "{{.VENV}}/python training/generate_overlay_textures.py {{.CLI_ARGS}}"

  # ---------- PRD Bloc 3 — Real-photo benchmark ----------
  benchmark:
    desc: "Run a benchmark against real photos. Usage: go-task ml:benchmark -- --model <path> [--zones green,orange] [--eurio-ids …]"
    cmds:
      - "{{.VENV}}/python eval/evaluate_real_photos.py {{.CLI_ARGS}}"

  benchmark:photos:check:
    desc: "Validate structure of ml/data/real_photos/ and regenerate _manifest.json"
    cmds:
      - "{{.VENV}}/python eval/check_real_photos.py {{.CLI_ARGS}}"

  # ---------- Sources orchestrator (docs/sources-refacto/) ----------
  src:run:
    desc: "Run the 8-step ingestion pipeline. Usage: go-task ml:src:run -- --source mock [--country FR --limit 5]"
    cmds:
      - "{{.VENV}}/python -m sources.cli {{.CLI_ARGS}}"

  src:run-dry:
    desc: "Same as src:run but stops after Discover. Usage: go-task ml:src:run-dry -- --source mock"
    cmds:
      - "{{.VENV}}/python -m sources.cli --dry-run {{.CLI_ARGS}}"

  src:mock:run:
    desc: "Shortcut: full mock pipeline run on the 5 fixture coins."
    cmds:
      - "{{.VENV}}/python -m sources.cli --source mock {{.CLI_ARGS}}"

  src:mock:dry:
    desc: "Shortcut: dry-run on the mock fixtures (Discover only)."
    cmds:
      - "{{.VENV}}/python -m sources.cli --source mock --dry-run {{.CLI_ARGS}}"

  src:ebay:run:
    desc: "Run eBay enrichment on the next 10 eurio_ids from freshness queue. Override: --batch N or --target-eurio-ids a,b,c"
    # EURIO_CENSUS_RECOVER=1 : passe de secours score-guided (stratégie A) quand le census ne
    # rend aucun crop → récupère les bimétal sous-croppés au lieu de les laisser zero_crops
    # (~77% du parc, validé 2026-06-15). Mettre 0 pour désactiver. Cf. vision/score_recover.py.
    env:
      EURIO_CENSUS_RECOVER: "1"
    cmds:
      - "{{.VENV}}/python -m sources.cli --source ebay {{.CLI_ARGS}}"

  src:ebay:reprocess-zero:
    desc: "Rejoue la détection sur les annonces eBay dont AUCUNE image n'a rendu de crop (O7, décision D5), avec la passe de secours score_recover ACTIVE — témoin : le log de run commence par `recover=ON tau=… scope=… listings=N images=M` ; sans cette ligne, aucun run n'est créé (exit 2). Zéro appel eBay (les raws sont en MinIO). Défaut : --scope deficit = les annonces visant une classe de banque à moins de 8 exemplaires fps (808 annonces, 143 classes au 2026-08-21) ; --scope all = les 2950. Aperçu : -- --dry-run [--scope all]. Essai : -- --limit 20 --seed 42. La chaîne aval est celle du scrape (resolve → auto_validate → enqueue) et le run est poussé au canonique dès qu'EURIO_API_URL est posé (--push = réplique scratch, --no-push = local seul). Spec : docs/work-in-progress/pipeline-propre/outils/O7-reprocess-zero-crops.md"
    # Même passe de secours que src:ebay:run — le script la pose aussi lui-même et
    # vérifie le témoin ; l'env ici garantit qu'un `--dry-run` la voit déjà active.
    env:
      EURIO_CENSUS_RECOVER: "1"
    cmds:
      - "{{.VENV}}/python -m scripts.reprocess_zero_crops {{.CLI_ARGS}}"

  src:ebay:dry:
    desc: "Preview eBay batch (Discover only) — no quota consumed beyond the search calls."
    cmds:
      - "{{.VENV}}/python -m sources.cli --source ebay --dry-run {{.CLI_ARGS}}"

  src:ebay:limit:
    desc: "eBay batch with custom size. Usage: go-task ml:src:ebay:limit -- --batch 5"
    env:
      EURIO_CENSUS_RECOVER: "1"
    cmds:
      - "{{.VENV}}/python -m sources.cli --source ebay {{.CLI_ARGS}}"

  src:ebay:status:
    desc: "Show eBay quota status + last 3 runs."
    cmds:
      - "{{.VENV}}/python -m sources.ebay.status_cli"

  ebay:allocate:
    desc: "Plan d'allocation du quota eBay (5000 appels/jour, du VRAI ARGENT) par déficit d'exemplaires. La maille n'est pas la classe mais le GROUPE DE DÉCOUVERTE (commémo → (2€, pays, année), standard → (2€, pays, None)) : les 671 classes de la banque 2eur_all se replient sur 416 groupes, dont ~380 portent un déficit — une décision sert plusieurs classes pour un coût constant. Dry-run par défaut : N'APPELLE PAS eBay, imprime le plan et les commandes. Réel : -- --execute --yes (les deux, --execute seul refuse) ; --dry-run et --execute sont EXCLUSIFS depuis le défaut S2 (avant, --dry-run n'était lu nulle part et la paire brûlait le quota). Ne vise jamais 1 exemplaire (--min-need 2, la courbe donne N=1 pire que N=0), soustrait ce qui attend déjà en review, et pondère ×2 les classes coincées à 1. ⚠️ Les coûts (130 appels par groupe commémo, 240 par standard) sont ESTIMÉS sur 15 groupes observés en 3 journées : un plan à 4920 appels peut en coûter 4000 ou 6000. Le préflight de sources.cli ne rattrape pas (il estime sur source_runs.n_calls, mesuré faux : 3 pour 740 appels réels) ; c'est l'allocateur qui relit api_call_log AVANT CHAQUE VAGUE et s'arrête si le restant passe sous le coût prévu × 1,3 (défaut S4). Premier lancement réel recommandé : -- --execute --yes --max-groups 2, puis confronter le coût prévu au compteur réel (sqlite3 -readonly state/eurio.local.db \"select period, calls from api_call_log where source=ebay\"). ⚠️ discovery_searches n'a pas été alimentée par le run du 2026-08-16 : le cooldown est aveugle aux runs passés par --target-eurio-ids. Doc : docs/work-in-progress/scan-sans-retrain/ALLOCATEUR-SCRAPE.md"
    cmds:
      - "{{.VENV}}/python -m scripts.allocate_ebay_scrape {{.CLI_ARGS}}"

  bootstrap-coins:
    desc: "Mirror eurio_referential.json → SQLite coins table (D-20). Idempotent."
    cmds:
      - "{{.VENV}}/python -m scripts.bootstrap_coins_from_referential {{.CLI_ARGS}}"

  bootstrap-coins-dry:
    desc: "Preview bootstrap-coins without writing."
    cmds:
      - "{{.VENV}}/python -m scripts.bootstrap_coins_from_referential --dry-run"

  migrate-canonical-schema:
    desc: "Harmonisation chunk 1b — backfill des colonnes canoniques de coins + tables filles depuis raw_payload_json + cohort_members. Idempotent, backup auto. Cf. docs/data-harmonization/."
    cmds:
      - "{{.VENV}}/python -m scripts.migrate_canonical_schema {{.CLI_ARGS}}"

  migrate-canonical-schema-dry:
    desc: "Preview de la migration chunk 1b sans écrire (le schéma reste appliqué par Store)."
    cmds:
      - "{{.VENV}}/python -m scripts.migrate_canonical_schema --dry-run"

  ingest-referential-catalog:
    desc: "Harmonisation chunk 2 — ingère coin_catalog.json (scrape Numista) → table referential_catalog. Idempotent."
    cmds:
      - "{{.VENV}}/python -m scripts.ingest_referential_catalog {{.CLI_ARGS}}"

  audit-referential:
    desc: "Harmonisation chunk 2 — audit lecture seule referential_catalog ↔ coins (écarts 2€ commémo, worklist Chunk 2b)."
    cmds:
      - "{{.VENV}}/python -m scripts.audit_referential {{.CLI_ARGS}}"

  generate-missing-coins:
    desc: "Harmonisation chunk 2b — génère les commémo 2€ manquantes depuis referential_catalog + corrige le cas BE 2017. Backup auto, idempotent."
    cmds:
      - "{{.VENV}}/python -m scripts.generate_missing_coins {{.CLI_ARGS}}"

  port-design-groups:
    desc: "Harmonisation chunk 3 — rapatrie les design_groups Supabase → eurio.db (table + coins.design_group_id). Idempotent, tolère les orphelins."
    cmds:
      - "{{.VENV}}/python -m scripts.port_design_groups {{.CLI_ARGS}}"

  recompute-coin-status:
    desc: "Harmonisation chunk 3 — recalcule coins.status (referenced/trained) depuis les runs réussis. Idempotent, à déclencher en fin de run."
    cmds:
      - "{{.VENV}}/python -m scripts.recompute_coin_status {{.CLI_ARGS}}"

  regen-bench-groups:
    desc: "Harmonisation — régénère discovery_bench/groups.json (contexte de jugement) depuis coins, après un changement du référentiel (ex. split BE 2017)."
    cmds:
      - "{{.VENV}}/python -m scripts.regen_bench_groups {{.CLI_ARGS}}"

  detect-supabase-drift:
    desc: "Harmonisation chunk 4 — détecte les dérives eurio.db ↔ Supabase (orphelins, champs divergents). Lecture seule."
    cmds:
      - "{{.VENV}}/python -m scripts.detect_supabase_drift {{.CLI_ARGS}}"

  # ---------- Storage migration (fs → MinIO) ----------
  # Spec: docs/harmonisation-images/chunk-3-migration-script.md
  migrate-inventory:
    desc: "Build migration manifest (sha256 + target S3 keys for canonical/raw/crop)."
    cmds:
      - "{{.VENV}}/python -m scripts.migrate_to_minio inventory"

  migrate-upload:
    desc: "Upload all manifest entries to MinIO (idempotent). Override: -- --workers 16 --category crop"
    cmds:
      - "{{.VENV}}/python -m scripts.migrate_to_minio upload {{.CLI_ARGS}}"

  migrate-db:
    desc: "Rewrite storage_path → S3 key in DB, archive original in storage_path_legacy."
    cmds:
      - "{{.VENV}}/python -m scripts.migrate_to_minio db"

  migrate-verify:
    desc: "sha256 sample audit against MinIO. Override: -- --sample-pct 10"
    cmds:
      - "{{.VENV}}/python -m scripts.migrate_to_minio verify {{.CLI_ARGS}}"

  migrate-lock-fs:
    desc: "chmod a-w on ml/datasets and ml/state/sources/*/{raw,crops} (7-day safety)."
    cmds:
      - "{{.VENV}}/python -m scripts.migrate_to_minio lock-fs"

  # ---------- Local cache ----------
  assets:status:
    desc: "Artefacts de modèle de l'APK : compare le disque au manifeste shared/model-assets.json"
    cmds:
      - "{{.VENV}}/python -m scripts.model_assets status"

  assets:publish:
    desc: "Publie les modèles de l'APK vers MinIO et réécrit le manifeste (--dry-run possible)"
    cmds:
      - "{{.VENV}}/python -m scripts.model_assets publish {{.CLI_ARGS}}"

  assets:fetch:
    desc: "Récupère les modèles épinglés par le manifeste dans app-android/src/main/assets/"
    cmds:
      - "{{.VENV}}/python -m scripts.model_assets fetch"

  # Artefacts d'ENTRAÎNEMENT (dataset de détection + best.pt) — distincts des
  # artefacts d'APK ci-dessus : une machine de compute en a besoin, un build
  # Android non. Les mêler ferait télécharger 67 Mo à chaque build.
  training-assets:status:
    desc: "Dataset de détection + poids : compare le disque au manifeste shared/training-assets.json"
    cmds:
      - "{{.VENV}}/python -m scripts.training_assets status"

  training-assets:publish:
    desc: "Publie le dataset de détection et best.pt vers MinIO, réécrit le manifeste (--dry-run possible)"
    cmds:
      - "{{.VENV}}/python -m scripts.training_assets publish {{.CLI_ARGS}}"

  freshness:
    desc: "De quand date ce que j'ai sous la main ? Local seulement, instantané, sans réseau ni secrets. Sort en 2 si quelque chose est en retard."
    cmds:
      - "{{.VENV}}/python -m scripts.freshness {{.CLI_ARGS}}"

  freshness:probe:
    desc: "Idem + interroge le canonique (retard de la réplique) et la prod (retard de la projection). Réseau et secrets requis."
    cmds:
      - "{{.VENV}}/python -m scripts.freshness --probe"

  training-assets:fetch:
    desc: "Rapatrie le dataset de détection et best.pt épinglés par le manifeste (à jouer sur la machine de compute)"
    cmds:
      - "{{.VENV}}/python -m scripts.training_assets fetch"

  cache-stats:
    desc: "Show local cache size + n_files (~/.cache/eurio)."
    cmds:
      - "{{.VENV}}/python -c 'from ml.storage.local_cache import cache_stats; import json; print(json.dumps(cache_stats(), indent=2))'"

  cache-purge:
    desc: "Wipe local cache root."
    prompt: "This will delete ~/.cache/eurio/. Continue?"
    cmds:
      - "{{.VENV}}/python -c 'from ml.storage.local_cache import purge_cache; purge_cache()'"

  # ---------- Cascade sync (MinIO ↔ DB ↔ cache) ----------
  # Spec: docs/harmonisation-images/chunk-9-cascade-sync.md
  cascade-sync:migrate:
    desc: "Add storage_status column on image_assets + source_images (idempotent)."
    cmds:
      - "{{.VENV}}/python -m scripts.cascade_sync migrate-schema"

  cascade-sync:audit:
    desc: "List drifts MinIO ↔ DB ↔ cache (read-only). Pass -- --check-cache to also walk the cache."
    cmds:
      - "{{.VENV}}/python -m scripts.cascade_sync audit {{.CLI_ARGS}}"

  cascade-sync:repair:
    desc: "Mark DB rows missing + (optionally) purge stale cache. MinIO orphans untouched."
    prompt: "This will mark DB rows as missing_in_storage. Continue?"
    cmds:
      - "{{.VENV}}/python -m scripts.cascade_sync repair {{.CLI_ARGS}}"

  cascade-sync:purge-cache:
    desc: "Walk cache, drop files whose sha256 no longer matches MinIO."
    prompt: "This will drop stale cache files. Continue?"
    cmds:
      - "{{.VENV}}/python -m scripts.cascade_sync purge-cache"

  # ---------- i18n bootstrap (Numista scrape via TOR) ----------
  # Spec: docs/sources-refacto/ebay-multi-marketplace/i18n-scrape-numista.md
  tor:up:
    desc: "Start TOR SOCKS5 proxy (127.0.0.1:9050) for Numista scrape."
    cmds:
      - docker compose -f infrastructure/tor/docker-compose.yml up -d
      - |
        echo "Waiting for TOR bootstrap (up to 60s)..."
        for i in $(seq 1 12); do
          if curl -s --max-time 5 --socks5-hostname 127.0.0.1:9050 \
              https://check.torproject.org/api/ip 2>/dev/null \
              | grep -q '"IsTor":true'; then
            echo "TOR ready:"
            curl -s --socks5-hostname 127.0.0.1:9050 https://check.torproject.org/api/ip
            exit 0
          fi
          echo "  ...not ready (attempt $i/12)"; sleep 5
        done
        echo "TOR did not become ready in 60s. Check: docker logs eurio-scrape-tor"
        exit 1

  tor:down:
    desc: "Stop TOR SOCKS5 proxy."
    cmds:
      - docker compose -f infrastructure/tor/docker-compose.yml down

  tor:logs:
    desc: "Tail TOR container logs."
    cmds:
      - docker logs -f eurio-scrape-tor

  bootstrap-coin-names-i18n:poc:
    desc: "POC: scrape 5 coins × FR+EN via TOR, dump JSON, no DB write."
    cmds:
      # Prefer .venv (mac/pc), fall back to nix-provided python (vps profile).
      - |
        if [ -x "{{.VENV}}/python" ]; then PY="{{.VENV}}/python"; else PY="python"; fi
        $PY -m scripts.bootstrap_coin_names_i18n --poc {{.CLI_ARGS}}

  # --- Full i18n pipeline (PC ⇄ VPS) ---
  # Step 1 (PC): export worklist from coins table.
  export-i18n-worklist:
    desc: "Export i18n scrape worklist (2eur coins × FR+EN) to state/i18n_worklist.json. Run on PC."
    cmds:
      - "{{.VENV}}/python -m scripts.export_i18n_worklist {{.CLI_ARGS}}"

  # Step 2 (VPS): full scrape via TOR, appends to results/failures JSONL.
  bootstrap-coin-names-i18n:
    desc: "Full scrape: read state/i18n_worklist.json, write state/i18n_{results,failures}.jsonl. Run on VPS (TOR up)."
    cmds:
      - |
        if [ -x "{{.VENV}}/python" ]; then PY="{{.VENV}}/python"; else PY="python"; fi
        $PY -m scripts.bootstrap_coin_names_i18n {{.CLI_ARGS}}

  # Step 3 (PC): import the results JSONL into the DB.
  import-i18n-results:
    desc: "Import state/i18n_results.jsonl into coin_names_i18n. Idempotent (INSERT OR IGNORE). Run on PC."
    cmds:
      - "{{.VENV}}/python -m scripts.import_i18n_results {{.CLI_ARGS}}"

  # ─── Coin richness — P.4 seed source_registry ────────────────────────────
  seed-source-registry:
    desc: "Seed source_registry with the 10 canonical sources. Idempotent (INSERT OR IGNORE). Pass --update for upsert, --check for read-only report."
    cmds:
      - "{{.VENV}}/python -m scripts.seed_source_registry {{.CLI_ARGS}}"

  # ─── Coin richness — P.5 verify backup ───────────────────────────────────
  verify-backup:
    desc: "Vérifie qu'un backup eurio.db est restaurable et fidèle à la DB courante (P.5). Lecture-seule, copie le backup dans /tmp avant inspection."
    cmds:
      - "{{.VENV}}/python -m scripts.verify_backup_restore {{.CLI_ARGS}}"

  # ─── Coin richness — P.6 wipe referential ────────────────────────────────
  wipe-referential:
    desc: "Wipe le référentiel + drop/recreate des 6 tables source-aware avec FK source. Par défaut --dry-run (lecture-seule). Pass --apply pour exécution sous confirmation interactive. ACTE DESTRUCTIF."
    cmds:
      - "{{.VENV}}/python -m scripts.wipe_referential {{.CLI_ARGS}}"

  # ─── Coin richness — P.7 refetch Numista (SQLite-target) ─────────────────
  refetch-numista:
    desc: "Refetch Numista 2€ → SQLite via --nids-file. P.7a scaffold = plan only. P.7b/c/d ajouteront fetch HTTP + transforms + tests."
    cmds:
      - "{{.VENV}}/python -m scripts.refetch_numista_2eur {{.CLI_ARGS}}"

  # ─── Coin richness — P.7c.1 seed mints eurozone ──────────────────────────
  seed-mints:
    desc: "Seed mints avec les 29 ateliers canoniques eurozone (DE A/D/F/G/J + autres pays). Idempotent. --update pour upsert, --check pour audit."
    cmds:
      - "{{.VENV}}/python -m scripts.seed_mints {{.CLI_ARGS}}"

  # ─── Corpus de scan rejouable (scan-quality/corpus-spec.md) ───────────────
  scan-corpus:prescribe:
    desc: "Plan de capture photo stratifié (P5) — lit la base en LECTURE SEULE (défaut de --db résolu à l'appel par store.resolve_db_path : EURIO_DB_PATH, sinon state/eurio.replica.db ; la valeur retenue est imprimée), sort le CSV de prescription classe × condition + la cohorte CSV. N'écrit rien en base. Cinq strates : riche / moyenne / canonique / hors_banque / orpheline. Une classe SANS FRÈRE en banque est « orpheline » et reste HORS PLAN par défaut (quota 0) — la photographier ne mesure pas une reconnaissance que rien ne peut faire, et la compter en hors_banque diluerait la seule strate qui mesure la maille eq. L'inclure est explicite : --classes-par-strate orpheline=all. Le récapitulatif imprime les classes ÉCARTÉES et pourquoi. Mesuré le 2026-08-19 sur la réplique : 80 classes / 400 cellules / 985 captures / 11 sessions, 0 orpheline. Usage: go-task ml:scan-corpus:prescribe [-- --classes-par-strate riche=15,orpheline=all --captures-canonique 4 --out <csv>]"
    cmds:
      - "{{.VENV}}/python -m scripts.build_scan_prescription {{.CLI_ARGS}}"

  scan-corpus:import:
    desc: "Import des captures device dans le corpus rejouable (JSONL + frames pullés → scan_corpus.db). Idempotent. Usage: go-task ml:scan-corpus:import ITERATION=<iid> [-- --backfill-debug-snaps <dir>]"
    preconditions:
      - sh: 'test -n "{{.ITERATION}}"'
        msg: "ITERATION required (e.g. ITERATION=5bf8edb0ad7d)"
    cmds:
      - "{{.VENV}}/python -m scripts.import_scan_corpus --iteration {{.ITERATION}} {{.CLI_ARGS}}"

  scan-corpus:replay:
    desc: "Replay d'un candidat {centroïdes, modèle, seuils} sur le corpus → scorecard + predictions + McNemar vs baseline. Usage: go-task ml:scan-corpus:replay -- --candidate <dir|label> [--baseline <dir>] [--cohort-id <id>]"
    cmds:
      - "{{.VENV}}/python -m scripts.replay_corpus {{.CLI_ARGS}}"

  scan-corpus:test:
    desc: "Tests unitaires du corpus rejouable (store + import + replay/McNemar)."
    cmds:
      - "{{.VENV}}/python -m pytest tests/test_scan_corpus_store.py tests/test_import_scan_corpus.py tests/test_replay_corpus.py tests/test_build_scan_prescription.py -v"

  # ─── Bench best-frame-capture (chunk 7) ───────────────────────────────────
  # Le pull device vit côté android (go-task android:bench:pull). Doc boucle
  # complète : ml/bench/conditions.md.
  bench:replay:
    desc: "Replay offline d'une session bench sous config alternative. Usage: go-task ml:bench:replay -- --session bench/sessions/<device>/sessions/<id> [--override clé=val …]"
    cmds:
      - "{{.VENV}}/python -m bench.replay_session {{.CLI_ARGS}}"

  bench:annotate:
    desc: "Annotation ground-truth interactive des sessions bench (best-frame humain + eurio_id). Usage: go-task ml:bench:annotate -- [--device <d>] [--session <id>] [--redo]"
    interactive: true
    cmds:
      - "{{.VENV}}/python -m bench.annotate_session {{.CLI_ARGS}}"

  bench:calibrate:
    desc: "Grid search seuils qualité (96 configs) sur les sessions annotées → ml/bench/reports/recommended_thresholds.json. Usage: go-task ml:bench:calibrate -- [--device <d>]"
    cmds:
      - "{{.VENV}}/python -m bench.calibrate_thresholds {{.CLI_ARGS}}"

  bench:compare:
    desc: "Rapport comparatif markdown + plots de N configs rejouées. Usage: go-task ml:bench:compare -- --run original --run nom:clé=val,… [--device <d>]"
    cmds:
      - "{{.VENV}}/python -m bench.compare_runs {{.CLI_ARGS}}"
